<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>일정 달력</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="일정 달력">
<meta name="theme-color" content="#2E6B4E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface2:#E8ECE6; --ink:#1B1F1C; --muted:#687069; --line:#D8DDD4;
  --accent:#2E6B4E; --accent-ink:#FFFFFF; --accent-soft:#DFEEE5; --accent-deep:#1F4D37;
  --sun:#C2453A; --sat:#3A5FB3; --hol:#C2453A;
  --warn:#9A6A12; --warn-soft:#F6EDD6; --neg:#B23F2E;
  --c-green:#2E6B4E; --c-green-soft:#DFEEE5;
  --c-teal:#1F8A8A; --c-teal-soft:#DCF0F0;
  --c-blue:#3568B5; --c-blue-soft:#E1EAF8;
  --c-sky:#2F8FD0; --c-sky-soft:#DFEEF9;
  --c-purple:#7A4FA6; --c-purple-soft:#EEE6F6;
  --c-lavender:#7C6BC9; --c-lavender-soft:#ECE8F9;
  --c-rose:#C4445E; --c-rose-soft:#FBE4E9;
  --c-coral:#D9573B; --c-coral-soft:#FBE5DF;
  --c-orange:#C96A1F; --c-orange-soft:#F8E7D7;
  --c-yellow:#A68300; --c-yellow-soft:#F7EFCB;
  --c-brown:#8A5A3C; --c-brown-soft:#F0E4DC;
  --c-gray:#5F6762; --c-gray-soft:#E6EAE5;
  --shadow:0 10px 30px rgba(27,31,28,.14);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131614; --surface:#1B1F1C; --surface2:#252A26; --ink:#ECEFEA; --muted:#9AA39C; --line:#333933;
    --accent:#7FC9A2; --accent-ink:#0E2219; --accent-soft:#1D3A2C; --accent-deep:#A9DCC0;
    --sun:#F08A80; --sat:#8FAEF0; --hol:#F08A80;
    --warn:#E2B55A; --warn-soft:#3A2F15; --neg:#E8806F;
    --c-green:#7FC9A2; --c-green-soft:#1D3A2C; --c-teal:#6FD3D3; --c-teal-soft:#163535;
    --c-blue:#8FB1F2; --c-blue-soft:#1F2B45; --c-sky:#7CC4F5; --c-sky-soft:#17303F;
    --c-purple:#C1A1E6; --c-purple-soft:#2D2238; --c-lavender:#BDB2F0; --c-lavender-soft:#28243D;
    --c-rose:#E8738C; --c-rose-soft:#3B2028; --c-coral:#F09076; --c-coral-soft:#3D221B;
    --c-orange:#E8A25F; --c-orange-soft:#3A2A16; --c-yellow:#E0C24A; --c-yellow-soft:#363012;
    --c-brown:#C9997A; --c-brown-soft:#35271E; --c-gray:#AEB6AF; --c-gray-soft:#2C312D;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#131614; --surface:#1B1F1C; --surface2:#252A26; --ink:#ECEFEA; --muted:#9AA39C; --line:#333933;
  --accent:#7FC9A2; --accent-ink:#0E2219; --accent-soft:#1D3A2C; --accent-deep:#A9DCC0;
  --sun:#F08A80; --sat:#8FAEF0; --hol:#F08A80;
  --warn:#E2B55A; --warn-soft:#3A2F15; --neg:#E8806F;
  --c-green:#7FC9A2; --c-green-soft:#1D3A2C; --c-teal:#6FD3D3; --c-teal-soft:#163535;
  --c-blue:#8FB1F2; --c-blue-soft:#1F2B45; --c-sky:#7CC4F5; --c-sky-soft:#17303F;
  --c-purple:#C1A1E6; --c-purple-soft:#2D2238; --c-lavender:#BDB2F0; --c-lavender-soft:#28243D;
  --c-rose:#E8738C; --c-rose-soft:#3B2028; --c-coral:#F09076; --c-coral-soft:#3D221B;
  --c-orange:#E8A25F; --c-orange-soft:#3A2A16; --c-yellow:#E0C24A; --c-yellow-soft:#363012;
  --c-brown:#C9997A; --c-brown-soft:#35271E; --c-gray:#AEB6AF; --c-gray-soft:#2C312D;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{overflow-x:hidden;max-width:100vw}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* 16px 미만이면 아이폰이 입력칸을 누를 때 자동 확대함 */
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
em,i{font-style:normal}

/* 색 토큰: 일정 색은 .c-* 클래스로 --c / --c-soft 두 변수만 바꿔서 쓴다 */
.c-green{--c:var(--c-green);--c-soft:var(--c-green-soft)} .c-teal{--c:var(--c-teal);--c-soft:var(--c-teal-soft)}
.c-blue{--c:var(--c-blue);--c-soft:var(--c-blue-soft)} .c-sky{--c:var(--c-sky);--c-soft:var(--c-sky-soft)}
.c-purple{--c:var(--c-purple);--c-soft:var(--c-purple-soft)} .c-lavender{--c:var(--c-lavender);--c-soft:var(--c-lavender-soft)}
.c-rose{--c:var(--c-rose);--c-soft:var(--c-rose-soft)} .c-coral{--c:var(--c-coral);--c-soft:var(--c-coral-soft)}
.c-orange{--c:var(--c-orange);--c-soft:var(--c-orange-soft)} .c-yellow{--c:var(--c-yellow);--c-soft:var(--c-yellow-soft)}
.c-brown{--c:var(--c-brown);--c-soft:var(--c-brown-soft)} .c-gray{--c:var(--c-gray);--c-soft:var(--c-gray-soft)}

#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@media (min-width:600px){ body{background:var(--surface2)} #app{box-shadow:0 0 0 1px var(--line);min-height:100vh} }

.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.topbar h1 .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink);background:transparent;flex:0 0 auto}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 8px}
.page{padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--surface2);color:var(--ink);border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;color:var(--neg);border-color:var(--line)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;flex:0 0 auto}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 예시 안내 */
.notice{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500;display:flex;gap:10px;align-items:center;line-height:1.45}
.notice span{flex:1}
.notice button{color:inherit;font-weight:700;text-decoration:underline;white-space:nowrap}


/* 달력 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px 10px;margin:12px 16px 0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 4px}
.cal-title{font-weight:600;font-size:16px;display:flex;align-items:baseline;gap:6px;padding:4px 8px;margin-left:-2px;border-radius:10px;min-width:0}
.cal-title:hover{background:var(--surface2)}
.cal-title .y{font-size:12.5px;color:var(--muted);font-family:var(--mono);font-weight:500}
.cal-title svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;align-self:center;flex:0 0 auto}
.cal-nav{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:3px}
.wk .su{color:var(--sun)} .wk .sa{color:var(--sat)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{position:relative;min-height:80px;display:flex;flex-direction:column;padding:5px 2px 3px;border-radius:10px;color:var(--ink);text-align:center;overflow:hidden}
.day.out{opacity:.38}
.day .n{font-family:var(--mono);font-size:14px;font-weight:500;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;margin:0 auto 2px;flex:0 0 auto;position:relative;z-index:1}
.day.su .n,.day.hol .n{color:var(--sun)} .day.sa .n{color:var(--sat)}
.day.today .n{background:var(--accent);color:var(--accent-ink);font-weight:600}
.day.sel{background:var(--accent-soft)}
.day.sel.today .n{box-shadow:0 0 0 2px var(--surface)}
.day .n.ic{font-family:var(--sans);display:flex;align-items:center;justify-content:center;width:28px;height:28px;overflow:visible;background:var(--c-soft);color:var(--ink)}
.day .n.ic .g{display:block;font-size:15px;line-height:1;font-style:normal}
.day.today .n.ic{background:var(--c-soft);box-shadow:0 0 0 2px var(--accent)}
.day.sel.today .n.ic{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ev{display:block;font-size:9.5px;line-height:14px;height:14px;margin:0 0 2px;padding:0 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;text-align:left;background:var(--c-soft);color:var(--c)}
.ev.span{margin-left:-2px;margin-right:-2px;border-radius:0}
.ev.span.ms{margin-left:0;border-radius:3px 0 0 3px}
.ev.span.me{margin-right:0;border-radius:0 3px 3px 0}
.ev.span.ms.me{margin:0;border-radius:3px}
.ev.timed{background:transparent;color:var(--ink);padding-left:1px}
.ev.timed::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin:0 3px 1px 0;vertical-align:middle}
.ev.hol{background:transparent;color:var(--hol);text-align:center;padding:0;font-weight:600}
.more{display:block;font-size:9.5px;line-height:14px;height:14px;color:var(--muted);text-align:left;padding-left:3px;font-weight:600;font-family:var(--mono)}

/* 일정 목록 */
.dayhead{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.dayhead .d{font-weight:600;font-size:14.5px}
.dayhead .d.today{color:var(--accent)}
.dayhead .h{font-size:12.5px;color:var(--hol);font-weight:600}
.dayhead .c{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 16px}
.erow{display:grid;grid-template-columns:4px 62px 1fr auto;gap:0 10px;align-items:center;width:100%;text-align:left;padding:11px 14px 11px 12px;border-top:1px solid var(--line);color:var(--ink)}
.erow:first-child{border-top:0}
.erow:hover{background:var(--surface2)}
.erow .stripe{width:4px;align-self:stretch;min-height:32px;border-radius:2px;background:var(--c)}
.erow .et{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden}
.erow .et b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.erow .em{min-width:0}
.erow .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.erow .t svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.erow .t .ki{font-size:15px;line-height:1.3;flex:0 0 auto}
.erow .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .dd{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--c);background:var(--c-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.erow .dd.now{color:var(--accent-ink);background:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.selbox{margin:16px 16px 0}
.selbox .list{margin:0}
.addrow{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:14px;text-align:left}
.addrow:first-child{border-top:0}
.addrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.noteline{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink);line-height:1.45}
.noteline:first-child{border-top:0}
.noteline svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.noteline .tx{flex:1;min-width:0;white-space:pre-line;overflow-wrap:anywhere}
.noteline .tx.ph{color:var(--muted)}
.noteline .tag{font-size:11px;color:var(--muted);font-weight:600;background:var(--surface2);padding:2px 7px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:500}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
mark{background:transparent;color:var(--accent);font-weight:700}

/* 주간 */
.wkhead{display:flex;align-items:center;justify-content:space-between;margin:14px 16px 0;gap:6px}
.wksum{margin:10px 20px 0;font-size:12.5px;color:var(--muted);display:flex;gap:14px}
.wksum b{color:var(--ink);font-family:var(--mono)}
.wklist{margin-top:10px}
.wkrow{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.wkrow:first-child{border-top:0}
.wkrow .dn{text-align:center;padding-top:2px}
.wkrow .dn b{display:block;font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.1}
.wkrow .dn span{font-size:11.5px;color:var(--muted);font-weight:600}
.wkrow.su .dn b,.wkrow.su .dn span,.wkrow.hol .dn b{color:var(--sun)} .wkrow.sa .dn b,.wkrow.sa .dn span{color:var(--sat)}
.wkrow.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;margin:0 auto;font-size:15px}
.wkrow .body{min-width:0}
.wkrow .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.wkrow .chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--c-soft);color:var(--c);display:inline-flex;gap:4px;align-items:center;max-width:100%}
.wkrow .chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkrow .chip.h{background:transparent;color:var(--hol);padding-left:0}
.wkrow .note{display:block;width:100%;text-align:left;font-size:14px;line-height:1.5;color:var(--ink);border-radius:8px;padding:2px 0;white-space:pre-line;overflow-wrap:anywhere}
.wkrow .note.empty{color:var(--muted)}
.wkrow .note.empty::before{content:"＋ ";opacity:.7}

/* 검색 */
.search{display:flex;align-items:center;gap:8px;margin:6px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 10px 0 12px;min-height:46px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;outline:none}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--muted)}
.search .clr{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface2);flex:0 0 auto}
.search .clr svg{width:14px;height:14px;stroke:currentColor}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted)}
.fchip em{font-size:14px;line-height:1}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.rescount{padding:12px 4px 0;font-size:12.5px;color:var(--muted);font-weight:500}
.rescount b{color:var(--ink);font-family:var(--mono)}
.sheet .list{margin:0}
.sheet .group{margin-top:12px}
.sheet .group .dayhead{padding:0 4px 6px}
.sheet .eyebrow{margin-top:18px}

/* 시트 */
.overlay{position:fixed;inset:0;background:rgba(14,20,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.overlay,.sheet,.toast{animation:none}}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);max-height:92dvh;display:flex;flex-direction:column;animation:up .2s ease}
.sheet.tall{height:92dvh}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.sheet-h h2{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{padding:6px 16px 12px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.sheet-f{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.sheet-f .btn.danger{flex:0 0 auto}
.field{margin-top:12px}
.field label.k,.field .k{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;min-height:44px}
.input.mono{font-family:var(--mono);font-size:16px;line-height:1.4}
textarea.input{resize:vertical;min-height:60px;line-height:1.4}
input[type=date].input,input[type=time].input{font-family:var(--mono);display:block;min-width:0;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.infobox{background:var(--accent-soft);color:var(--accent-deep);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-top:12px;line-height:1.5}
.infobox.plain{background:var(--surface2);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 0;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle .l{font-weight:500;font-size:15px}
.toggle .h{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);flex:0 0 auto;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.klist{display:flex;flex-direction:column;gap:6px}
.krow{display:grid;grid-template-columns:28px 52px 1fr 30px;gap:5px;align-items:center;border-radius:10px;transition:transform .12s ease}
.krow .x{width:30px;height:30px}
.krow .grip{width:28px;height:40px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:8px}
.krow .grip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
.krow .grip:active{cursor:grabbing}
.krow.dragging{transition:none;background:var(--surface);box-shadow:var(--shadow);position:relative;z-index:2;outline:1px solid var(--line)}
.krow.dragging .input{background:var(--surface)}
.klist.dragging-list,.klist.dragging-list *{-webkit-user-select:none;user-select:none}
.dots{display:grid;grid-template-columns:repeat(6,1fr);justify-items:center;gap:8px 4px;padding:2px 0;max-width:300px}
.dot{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.dot input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.dot i{width:22px;height:22px;border-radius:50%;background:var(--c);display:block;transition:transform .1s}
.dot:has(input:checked){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.dot:has(input:checked) i{transform:scale(.8)}
.dot:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
.field .k b{color:var(--ink);font-weight:600;margin-left:4px}
.krow .input{padding:8px 10px;min-height:42px}
.krow .input.ic{text-align:center;font-size:20px;padding:4px}
.x{color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.x:hover{background:var(--surface2);color:var(--neg)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* 연/월/주 선택 */
.yrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.yrow .yl{font-family:var(--mono);font-size:20px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mgrid button{position:relative;padding:14px 0;border-radius:12px;background:var(--surface2);font-weight:600;font-size:15px;color:var(--ink)}
.mgrid button.on{background:var(--accent);color:var(--accent-ink)}
.mgrid button.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.mgrid button.has::after{content:"";position:absolute;left:50%;bottom:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.mgrid button.on.has::after{background:var(--accent-ink)}
.wgrid{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.wgrid button{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14.5px;color:var(--ink)}
.wgrid button span{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-weight:500}
.wgrid button.on{background:var(--accent);color:var(--accent-ink)} .wgrid button.on span{color:var(--accent-ink);opacity:.8}
.wgrid button.cur{box-shadow:inset 0 0 0 2px var(--accent)}

/* 탭바 + 추가 버튼 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(16px,calc(50% - 240px + 16px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* 토스트 */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);animation:fade .15s ease;max-width:86vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1><span class="dot"></span>일정 달력</h1>
    <button type="button" class="iconbtn" data-act="search" aria-label="검색" title="검색">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button type="button" class="iconbtn" data-act="backup" aria-label="백업" title="백업">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
    <button type="button" class="iconbtn" data-act="settings" aria-label="설정" title="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="main"></main>
  <button type="button" class="fab" data-act="add" aria-label="일정 추가" title="일정 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ====================== 저장 ====================== */
const KEY='sched-cal.v1';
const COLORS=[['green','숲'],['teal','민트'],['blue','바다'],['sky','하늘'],['purple','포도'],['lavender','라벤더'],['rose','장미'],['coral','산호'],['orange','살구'],['yellow','노랑'],['brown','갈색'],['gray','잿빛']];
const REPEATS=[['none','반복 없음'],['weekly','매주'],['monthly','매월'],['yearly','매년']];
const DEF_KINDS=()=>[{id:'birthday',icon:'🎂',name:'생일'},{id:'anniv',icon:'💐',name:'기념일'},{id:'travel',icon:'✈️',name:'여행'},{id:'meet',icon:'🍽️',name:'약속'},{id:'hospital',icon:'🏥',name:'병원'},{id:'vacation',icon:'🏖️',name:'휴가'}];
const NOTE_MAX=140;
const DEF=()=>({version:2,events:[],notes:{},sampleNotes:[],settings:{theme:'system',weekStart:0,holidays:true,kinds:DEF_KINDS()}});
let S, V;
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function firstGrapheme(s){ s=String(s||'').trim(); if(!s) return ''; try{ const seg=new Intl.Segmenter('ko',{granularity:'grapheme'}); for(const g of seg.segment(s)) return g.segment }catch(e){} return [...s][0]||'' }
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY) }catch(e){ return null }
  if(!raw) return null; // 처음 열었을 때
  try{ return migrate(JSON.parse(raw)) }
  catch(e){ try{localStorage.setItem(KEY+'.broken.'+Date.now(),raw)}catch(e2){} return DEF() }
}
function migrate(d){
  if(!d||typeof d!=='object') d={};
  const colorOk=new Set(COLORS.map(c=>c[0])), repOk=new Set(REPEATS.map(r=>r[0]));
  d.events=(Array.isArray(d.events)?d.events:[]).filter(e=>e&&isDate(e.start)&&String(e.title||'').trim()).map(e=>{
    const end=isDate(e.end)&&e.end>e.start?e.end:null;
    const allDay=e.allDay!==false&&!e.time;
    return {id:String(e.id||uid()),title:String(e.title).trim().slice(0,60),start:e.start,end,allDay,
      time:allDay?'':(isTime(e.time)?e.time:''),endTime:allDay?'':(isTime(e.endTime)?e.endTime:''),
      color:colorOk.has(e.color)?e.color:'green',kind:String(e.kind||'').slice(0,40),place:String(e.place||'').slice(0,80),memo:String(e.memo||'').slice(0,500),
      repeat:repOk.has(e.repeat)?e.repeat:'none',sample:!!e.sample};
  });
  const notes={}; if(d.notes&&typeof d.notes==='object') for(const [k,v] of Object.entries(d.notes)){ const t=String(v||'').trim(); if(isDate(k)&&t) notes[k]=t.slice(0,NOTE_MAX) }
  d.notes=notes;
  d.sampleNotes=(Array.isArray(d.sampleNotes)?d.sampleNotes:[]).filter(isDate);
  const s=Object.assign({theme:'system',weekStart:0,holidays:true},d.settings||{});
  s.weekStart=s.weekStart===1?1:0; s.holidays=s.holidays!==false;
  if(Array.isArray(s.kinds)) s.kinds=s.kinds.map(k=>k&&typeof k==='object'?{id:String(k.id||uid()).slice(0,40),icon:firstGrapheme(k.icon)||'📌',name:String(k.name||'').trim().slice(0,12)}:null).filter(k=>k&&k.name);
  else s.kinds=DEF_KINDS();
  d.settings=s; d.version=2;
  sortE(d); return d;
}
function sortE(d){ d.events.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.time||'').localeCompare(b.time||'')) }
function save(){ sortE(S); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장하지 못했어요. 저장 공간을 확인해 주세요')} }
function loadView(){ try{ const v=JSON.parse(localStorage.getItem(KEY+'.view')); if(v&&/^\d{4}-\d{2}$/.test(v.month)){ if(!isDate(v.sel)) v.sel=today(); if(!isDate(v.week)) v.week=mondayOf(today()); if(v.tab!=='week') v.tab='cal'; return v } }catch(e){} return {month:today().slice(0,7),sel:today(),week:mondayOf(today()),tab:'cal'} }
function saveView(){ try{localStorage.setItem(KEY+'.view',JSON.stringify(V))}catch(e){} }
// 처음 열면 예시 일정과 예시 기록을 넣어 어떻게 보이는지 보여준다. 전부 sample 표시가 있어 한 번에 지울 수 있다
function seed(){
  const t=today(), d=parse(t);
  const dom25=`${d.getFullYear()}-${pad(d.getMonth()+1)}-25`;
  const mk=(o)=>Object.assign({id:uid(),end:null,allDay:true,time:'',endTime:'',color:'green',kind:'',place:'',memo:'',repeat:'none',sample:true},o);
  const s=DEF();
  s.events=[
    mk({title:'치과 정기검진',start:addDays(t,1),allDay:false,time:'14:00',endTime:'15:00',color:'blue',kind:'hospital',place:'역 앞 치과',memo:'보험 카드 챙기기'}),
    mk({title:'친구들과 저녁',start:addDays(t,3),allDay:false,time:'19:00',color:'coral',kind:'meet',place:'성수동'}),
    mk({title:'제주 여행',start:addDays(t,10),end:addDays(t,12),color:'sky',kind:'travel',memo:'렌터카 예약 확인'}),
    mk({title:'엄마 생일',start:addDays(t,24),color:'rose',kind:'birthday',repeat:'yearly'}),
    mk({title:'월세 이체',start:dom25,color:'yellow',repeat:'monthly',memo:'매달 25일'}),
  ];
  s.notes[addDays(t,-1)]='연차 쓰고 집에서 쉼'; s.notes[addDays(t,-3)]='팀 회식. 2차는 빠짐';
  s.sampleNotes=[addDays(t,-1),addDays(t,-3)];
  return migrate(s);
}

/* ====================== 날짜 ====================== */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s).getTime());
const isTime=s=>typeof s==='string'&&/^\d{2}:\d{2}$/.test(s);
const dim=(y,m0)=>new Date(y,m0+1,0).getDate();
const WD=['일','월','화','수','목','금','토'];
function kdate(s,withYear){ const d=parse(s); return `${withYear?d.getFullYear()+'년 ':''}${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})` }
function kshort(s){ const d=parse(s); return `${d.getMonth()+1}.${d.getDate()}` }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function relDay(n){ if(n===0) return '오늘'; if(n===1) return '내일'; if(n===2) return '내일모레'; if(n===-1) return '어제'; return n>0?`D-${n}`:`${-n}일 전` }
// 주간: 항상 월요일 시작
const mondayOf=d=>addDays(d,-((parse(d).getDay()+6)%7));
function weeksOfMonth(y,m0){ // 목요일이 그 달에 들어가는 주들의 월요일 (달력 관례)
  const out=[]; let d=mondayOf(`${y}-${pad(m0+1)}-01`);
  for(let i=0;i<7;i++){ const th=parse(addDays(d,3)); if(th.getFullYear()===y&&th.getMonth()===m0) out.push(d); else if(out.length) break; d=addDays(d,7) }
  return out;
}
function weekLabel(mon){ const th=parse(addDays(mon,3)); const y=th.getFullYear(), m0=th.getMonth(); const n=weeksOfMonth(y,m0).indexOf(mon)+1; return {y,m:m0+1,n,range:`${kshort(mon)}–${kshort(addDays(mon,6))}`} }

/* ====================== 공휴일 (대한민국) ====================== */
// 설날 당일 · 부처님오신날 · 추석 당일의 양력 날짜. 표에 없는 해는 양력 공휴일만 표시한다
const LUNAR={2024:['02-10','05-15','09-17'],2025:['01-29','05-05','10-06'],2026:['02-17','05-24','09-25'],2027:['02-07','05-13','09-15'],2028:['01-26','05-02','10-03'],2029:['02-13','05-20','09-22'],2030:['02-03','05-09','09-12']};
const HOL_CACHE={};
function holidays(y){
  if(HOL_CACHE[y]) return HOL_CACHE[y];
  const list=[]; // {d,n,sub:대체공휴일 대상인지, sat:토요일도 대체하는지}
  const fixed=[['01-01','신정',false,false],['03-01','삼일절',true,true],['05-05','어린이날',true,true],['06-06','현충일',false,false],['08-15','광복절',true,true],['10-03','개천절',true,true],['10-09','한글날',true,true],['12-25','성탄절',true,true]];
  for(const [md,n,sub,sat] of fixed) list.push({d:`${y}-${md}`,n,sub,sat});
  const L=LUNAR[y];
  if(L){
    const sl=`${y}-${L[0]}`, bd=`${y}-${L[1]}`, ch=`${y}-${L[2]}`;
    for(const k of [-1,0,1]) list.push({d:addDays(sl,k),n:'설날',sub:true,sat:false});
    list.push({d:bd,n:'부처님오신날',sub:true,sat:true});
    for(const k of [-1,0,1]) list.push({d:addDays(ch,k),n:'추석',sub:true,sat:false});
  }
  const map=new Map(); for(const h of list) if(!map.has(h.d)) map.set(h.d,h.n);
  // 대체공휴일: 일요일(일부는 토요일도)이거나 다른 공휴일과 겹치면, 그 다음 평일 하루를 쉰다. 겹친 날은 하루만 추가한다
  const byDate=new Map(); for(const h of list) (byDate.get(h.d)||byDate.set(h.d,[]).get(h.d)).push(h);
  for(const d of [...byDate.keys()].sort()){
    const hs=byDate.get(d); if(!hs.some(h=>h.sub)) continue;
    const dow=parse(d).getDay();
    const need=dow===0||(dow===6&&hs.some(h=>h.sub&&h.sat))||hs.length>1;
    if(!need) continue;
    let s=addDays(d,1); while(map.has(s)||[0,6].includes(parse(s).getDay())) s=addDays(s,1);
    map.set(s,'대체공휴일');
  }
  HOL_CACHE[y]=map; return map;
}
const holidayOf=d=>S.settings.holidays?(holidays(parse(d).getFullYear()).get(d)||null):null;

/* ====================== 일정 전개 ====================== */
const kindOf=id=>id?(S.settings.kinds.find(k=>k.id===id)||null):null;
// 한 일정이 [from,to] 사이에 나타나는 날짜들을 돌려준다. 반복 일정은 여기서 펼친다
function occursIn(ev,from,to){
  const len=ev.end?diff(ev.start,ev.end):0;
  const out=[]; const push=s=>{ const e=addDays(s,len); if(e>=from&&s<=to) out.push({ev,start:s,end:e,len}) };
  if(ev.repeat==='none'){ push(ev.start); return out }
  const sd=parse(ev.start);
  if(ev.repeat==='weekly'){
    let s=ev.start; if(s<from){ const k=Math.max(0,Math.floor((diff(s,from)-len)/7)); s=addDays(s,k*7) }
    for(;s<=to;s=addDays(s,7)) push(s); return out;
  }
  if(ev.repeat==='monthly'){
    let y=sd.getFullYear(), m=sd.getMonth();
    const f=parse(from); let fy=f.getFullYear(), fm=f.getMonth()-1; if(fm<0){fm=11;fy--}
    if(y*12+m<fy*12+fm){ y=fy; m=fm }
    for(let i=0;i<600;i++){ const s=`${y}-${pad(m+1)}-${pad(Math.min(sd.getDate(),dim(y,m)))}`; if(s>to) break; if(s>=ev.start) push(s); m++; if(m>11){m=0;y++} }
    return out;
  }
  if(ev.repeat==='yearly'){
    const toY=Number(to.slice(0,4));
    for(let y=Math.max(sd.getFullYear(),Number(from.slice(0,4))-1);y<=toY;y++){ const s=`${y}-${pad(sd.getMonth()+1)}-${pad(Math.min(sd.getDate(),dim(y,sd.getMonth())))}`; if(s>=ev.start) push(s) }
    return out;
  }

}
function occurrences(from,to){
  const all=[]; for(const ev of S.events) all.push(...occursIn(ev,from,to));
  // 여러 날 일정 → 하루 종일 → 시간순
  all.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(b.len-a.len)||((a.ev.allDay?0:1)-(b.ev.allDay?0:1))||(a.ev.time||'').localeCompare(b.ev.time||'')||a.ev.title.localeCompare(b.ev.title,'ko'));
  return all;
}

}
function groupBy(arr,keyFn){ const m=new Map(); for(const o of arr){ const k=keyFn(o); (m.get(k)||m.set(k,[]).get(k)).push(o) } return [...m.entries()] }

function calendar(){

  const first=addDays(`${y}-${pad(m)}-01`,-lead), last=addDays(first,total-1);
  // 날짜별 일정 묶기
  const dmap=new Map();
  for(const o of occurrences(first,last)){
    const a=o.start<first?first:o.start, b=o.end>last?last:o.end;

  }

let Q='', KF=''; // KF: '' 전체, 'none' 일반, 그 외 종류 id
const matchKind=ev=>!KF||(KF==='none'?!kindOf(ev.kind):ev.kind===KF);
const kfLabel=()=>KF==='none'?'일반':(kindOf(KF)?kindOf(KF).icon+' '+kindOf(KF).name:'');
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function hl(text,q){ // 검색어와 맞는 부분을 강조. 공백 무시 비교라서 원문 글자 위치로 다시 찾는다
  const src=String(text||''); if(!q) return esc(src);
  const lower=src.toLowerCase(); const idx=[];
  for(let i=0;i<lower.length;i++) if(!/\s/.test(lower[i])) idx.push(i);
  const flat=idx.map(i=>lower[i]).join(''); const at=flat.indexOf(q); if(at<0) return esc(src);
  const a=idx[at], b=idx[at+q.length-1]+1;
  return esc(src.slice(0,a))+'<mark>'+esc(src.slice(a,b))+'</mark>'+esc(src.slice(b));
}
function searchBody(){
  const t=today(), q=norm(Q);
  const section=(title,list,dday)=>list.length?`<div class="eyebrow">${title}</div>`+groupBy(list,o=>o.start<t&&o.end>=t?t:o.start).map(([d,l])=>{ const hol=holidayOf(d); return `<section class="group"><div class="dayhead"><span class="d ${d===t?'today':''}">${esc(kdate(d,d.slice(0,4)!==t.slice(0,4)))}</span>${hol?`<span class="h">${esc(hol)}</span>`:''}<span class="c">${esc(relDay(diff(t,d)))}</span></div><div class="list">${l.map(o=>eventRow(o,{q,dday})).join('')}</div></section>` }).join(''):'';
  if(!q&&!KF){
    const up=occurrences(addDays(t,-60),addDays(t,60)).filter(o=>o.end>=t);
    return up.length?section('다가오는 일정 · 60일',up,false):`<div class="empty" style="padding-top:30px"><b>다가오는 일정이 없어요</b>제목·장소·메모·한 줄 기록에서 찾을 수 있어요.</div>`;
  }
  if(!q){ // 종류만 고른 경우: 그 종류의 일정을 앞뒤 1년치로
    const occ=occurrences(addDays(t,-366),addDays(t,366)).filter(o=>matchKind(o.ev));
    const up=occ.filter(o=>o.end>=t), past=occ.filter(o=>o.end<t).reverse();
    if(!occ.length) return `<div class="empty" style="padding-top:30px"><b>${esc(kfLabel())} 일정이 없어요</b>앞뒤 1년 안에 이 종류로 저장된 일정이 없어요.</div>`;
    return `<div class="rescount">${esc(kfLabel())} · 일정 <b>${occ.length}</b>개 · 앞뒤 1년</div>${section('다가오는 일정',up,false)}${section('지난 일정',past,false)}`;
  }
  const evs=S.events.filter(e=>matchKind(e)&&[e.title,e.place,e.memo].some(v=>norm(v).includes(q)));
  let occ=[];
  for(const ev of evs){ if(ev.repeat==='none') occ.push(...occursIn(ev,ev.start,ev.start)); else occ.push(...occursIn(ev,addDays(t,-366),addDays(t,366))) }
  occ.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.ev.time||'').localeCompare(b.ev.time||''));
  const up=occ.filter(o=>o.end>=t), past=occ.filter(o=>o.end<t).reverse();
  const notes=KF?[]:Object.entries(S.notes).filter(([d,v])=>norm(v).includes(q)).sort((a,b)=>a[0]<b[0]?1:-1);
  if(!occ.length&&!notes.length) return `<div class="empty" style="padding-top:30px"><b>"${esc(Q.trim())}" 결과가 없어요</b>${KF?`${esc(kfLabel())} 종류 안에서 찾았어요. 전체로 바꾸면 더 나올 수 있어요.`:'제목, 장소, 메모, 한 줄 기록에서 찾아요. 띄어쓰기는 무시해요.'}</div>`;
  const noteHtml=notes.length?`<div class="eyebrow">한 줄 기록</div><div class="list">${notes.map(([d,v])=>`<button type="button" class="noteline" data-act="note" data-date="${d}">${I.pen}<span class="tx">${hl(v,q)}</span><span class="tag">${esc(kshort(d))}</span></button>`).join('')}</div>`:'';
  return `<div class="rescount">${KF?esc(kfLabel())+' · ':''}일정 <b>${evs.length}</b>개${KF?'':` · 기록 <b>${notes.length}</b>개`}${evs.some(e=>e.repeat!=='none')?' · 반복 일정은 앞뒤 1년치만 보여요':''}</div>${section('다가오는 일정',up,false)}${section('지난 일정',past,false)}${noteHtml}`;
}

  const reps=REPEATS.map(([k,n])=>`<option value="${k}"${ev.repeat===k?' selected':''}>${n}</option>`).join('');
  const body=`
    ${field('제목',`<input class="input" name="title" maxlength="60" placeholder="예: 치과 예약" value="${esc(ev.title)}" autocomplete="off" enterkeyhint="done">`)}
    ${field('종류',`<select class="input" name="kind">${kinds}</select>`)}
    <div class="field"><span class="k">색<b id="colorName">${esc(colorName(ev.color))}</b></span><div class="dots">${colors}</div></div>
    <div class="hint" style="margin-top:6px;font-size:12px;color:var(--muted)">종류가 일반이 아니면 달력의 날짜 숫자 자리에 아이콘이 보여요. 종류 목록과 순서는 설정에서 바꿀 수 있어요.</div>
    <div class="field"><span class="k">시간</span><div class="seg" id="seg"><button type="button" class="${allDay?'on':''}" data-allday="1">하루 종일</button><button type="button" class="${allDay?'':'on'}" data-allday="0">시간 지정</button></div></div>
    <div class="two">
      ${field('날짜',`<input class="input" type="date" name="start" value="${ev.start}" required>`)}
      ${field('마지막 날',`<input class="input" type="date" name="end" value="${ev.end||''}" min="${ev.start}">`,'여러 날 일정이면 입력')}
    </div>
    <div class="two" id="timeRow"${allDay?' hidden':''}>
      ${field('시작 시간',`<input class="input" type="time" name="time" value="${ev.time||''}">`)}
      ${field('끝나는 시간',`<input class="input" type="time" name="endTime" value="${ev.endTime||''}">`,'비워도 돼요')}
    </div>
    ${field('반복',`<select class="input" name="repeat">${reps}</select>`,'생일·기념일은 매년, 월세·구독은 매월로 넣으면 해마다 자동으로 나와요')}
    ${field('장소',`<input class="input" name="place" maxlength="80" placeholder="예: 성수동 카페" value="${esc(ev.place)}" autocomplete="off">`)}
    ${field('메모',`<textarea class="input" name="memo" rows="2" maxlength="500" placeholder="챙길 것, 링크, 연락처 등">${esc(ev.memo)}</textarea>`)}
    ${!isNew&&ev.repeat!=='none'?`<div class="infobox plain">반복 일정이에요. 고치거나 지우면 모든 반복 날짜에 함께 적용돼요.</div>`:''}`;
  const form=openSheet(isNew?'일정 추가':'일정 수정',body,{
    submitLabel:'저장',
    extraFooter:isNew?'':`<button type="button" class="btn danger" id="delBtn">삭제</button>`,
    onSubmit:f=>{
      const title=f.title.value.trim(); if(!title) return toast('제목을 입력해 주세요');
      const start=f.start.value; if(!isDate(start)) return toast('날짜를 입력해 주세요');
      let end=f.end.value||null; if(end&&!isDate(end)) return toast('마지막 날 형식이 맞지 않아요');
      if(end&&end<start) return toast('마지막 날이 시작 날보다 빨라요');
      if(end===start) end=null;
      if(end&&diff(start,end)>365) return toast('1년을 넘는 일정은 넣을 수 없어요');
      const time=allDay?'':f.time.value, endTime=allDay?'':f.endTime.value;
      if(!allDay&&!isTime(time)) return toast('시작 시간을 넣거나 "하루 종일"을 선택해 주세요');
      if(endTime&&!end&&endTime<time) return toast('끝나는 시간이 시작 시간보다 빨라요');
      const color=(f.querySelector('input[name=color]:checked')||{}).value||'green';
      const kind=f.kind.value||'';
      const data={id:ev.id,title,start,end,allDay,time,endTime,color,kind,place:f.place.value.trim(),memo:f.memo.value.trim(),repeat:f.repeat.value,sample:false};
      if(isNew) S.events.push(data); else { const i=S.events.findIndex(x=>x.id===ev.id); if(i>=0) S.events[i]=data; else S.events.push(data) }
      save(); closeSheet(); V.month=start.slice(0,7); V.sel=start; V.week=mondayOf(start); saveView(); render(); toast(isNew?'일정을 추가했어요':'수정했어요');
    }
  });
  form.querySelector('.dots').addEventListener('change',e=>{ if(e.target.name==='color') form.querySelector('#colorName').textContent=colorName(e.target.value) });
  const seg=form.querySelector('#seg'), timeRow=form.querySelector('#timeRow');
  seg.addEventListener('click',e=>{ const b=e.target.closest('[data-allday]'); if(!b) return; allDay=b.dataset.allday==='1'; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); timeRow.hidden=allDay; if(!allDay&&!form.time.value) form.time.focus() });
  form.start.addEventListener('change',()=>{ form.end.min=form.start.value; if(form.end.value&&form.end.value<form.start.value) form.end.value='' });
  if(isNew) setTimeout(()=>{ try{form.title.focus()}catch(e){} },50);
  const del=form.querySelector('#delBtn');
  if(del) del.addEventListener('click',()=>{ if(!del.dataset.armed){del.dataset.armed='1';del.textContent='정말 삭제';setTimeout(()=>{if(del.isConnected){delete del.dataset.armed;del.textContent='삭제'}},3000);return} S.events=S.events.filter(q=>q.id!==ev.id); save(); closeSheet(); render(); toast('삭제했어요') });
}
function newEvent(date){ return {id:uid(),title:'',start:date||today(),end:null,allDay:true,time:'',endTime:'',color:'green',kind:'',place:'',memo:'',repeat:'none'} }

/* 한 줄 기록 */
function noteSheet(d){
  const cur=S.notes[d]||'';
  const body=`${field('이 날 한 줄',`<textarea class="input" name="note" rows="4" maxlength="${NOTE_MAX}" placeholder="예: 연차 쓰고 집에서 쉼" enterkeyhint="enter">${esc(cur)}</textarea>`,`${NOTE_MAX}자까지 · 줄바꿈도 돼요 · 달력에는 안 보이고 주간 탭과 그 날 목록에서만 보여요`)}`;
  const form=openSheet(kdate(d,true),body,{
    submitLabel:'저장',
    extraFooter:cur?`<button type="button" class="btn danger" id="delNote">지우기</button>`:'',
    onSubmit:f=>{ const v=f.note.value.trim().slice(0,NOTE_MAX); if(v) S.notes[d]=v; else delete S.notes[d]; S.sampleNotes=S.sampleNotes.filter(x=>x!==d); save(); closeSheet(); render(); toast(v?'기록했어요':'지웠어요') }
  });
  setTimeout(()=>{ try{ form.note.focus(); form.note.setSelectionRange(cur.length,cur.length) }catch(e){} },50);
  const del=form.querySelector('#delNote'); if(del) del.addEventListener('click',()=>{ delete S.notes[d]; S.sampleNotes=S.sampleNotes.filter(x=>x!==d); save(); closeSheet(); render(); toast('지웠어요') });
}

/* 연/월 선택 */
function monthPicker(){
  let [py]=V.month.split('-').map(Number);
  const cur=V.month, tm=today().slice(0,7);
  const body=`<div class="yrow"><button type="button" class="iconbtn" data-y="-1" aria-label="이전 해">${I.prev}</button><span class="yl" id="yl"></span><button type="button" class="iconbtn" data-y="1" aria-label="다음 해">${I.next}</button></div><div class="mgrid" id="mg"></div><div class="hint" style="margin-top:10px;font-size:12px;color:var(--muted)">점이 있는 달에 일정이 있어요.</div>`;
  const form=openSheet('이동할 달 선택',body,{submitLabel:'이번 달로',onSubmit:()=>{ V.month=tm; V.sel=today(); saveView(); closeSheet(); render() }});
  const draw=()=>{
    const has=monthsWithEvents(py);
    form.querySelector('#yl').textContent=py+'년';
    form.querySelector('#mg').innerHTML=Array.from({length:12},(_,i)=>{ const k=`${py}-${pad(i+1)}`; return `<button type="button" data-m="${k}" class="${k===cur?'on':''} ${k===tm?'cur':''} ${has.has(k)?'has':''}">${i+1}월</button>` }).join('');
  };
  form.querySelectorAll('[data-y]').forEach(b=>b.addEventListener('click',()=>{ py+=Number(b.dataset.y); draw() }));
  form.querySelector('#mg').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; V.month=b.dataset.m; V.sel=V.month===tm?today():V.month+'-01'; saveView(); closeSheet(); render() });
  draw();
}
function monthsWithEvents(py){ const has=new Set(); for(const o of occurrences(`${py}-01-01`,`${py}-12-31`)) for(let d=o.start<`${py}-01-01`?`${py}-01-01`:o.start;d<=o.end&&d.startsWith(String(py));d=addDays(d,1)) has.add(d.slice(0,7)); return has }

/* 주 선택: 해 → 달 → 그 달의 주 */
function weekPicker(){
  const t=today(), cur=V.week||mondayOf(t), thisW=mondayOf(t);
  const cl=weekLabel(cur); let py=cl.y, pm=cl.m; // 보고 있는 주의 해/달에서 시작
  const body=`<div class="yrow"><button type="button" class="iconbtn" data-y="-1" aria-label="이전 해">${I.prev}</button><span class="yl" id="yl"></span><button type="button" class="iconbtn" data-y="1" aria-label="다음 해">${I.next}</button></div><div class="mgrid" id="mg"></div><div class="wgrid" id="wg"></div><div class="hint" style="margin-top:10px;font-size:12px;color:var(--muted)">달을 고른 뒤 주를 누르면 바로 이동해요.</div>`;
  const form=openSheet('이동할 주 선택',body,{submitLabel:'이번 주로',onSubmit:()=>{ V.week=thisW; saveView(); closeSheet(); render() }});
  const tl=weekLabel(thisW);
  const draw=()=>{
    form.querySelector('#yl').textContent=py+'년';
    const has=monthsWithEvents(py);
    form.querySelector('#mg').innerHTML=Array.from({length:12},(_,i)=>{ const k=`${py}-${pad(i+1)}`; return `<button type="button" data-m="${i+1}" class="${i+1===pm?'on':''} ${py===tl.y&&i+1===tl.m?'cur':''} ${has.has(k)?'has':''}">${i+1}월</button>` }).join('');
    form.querySelector('#wg').innerHTML=weeksOfMonth(py,pm-1).map((mon,i)=>{ let n=0; for(let k=0;k<7;k++) if(S.notes[addDays(mon,k)]) n++; const evn=occurrences(mon,addDays(mon,6)).length; return `<button type="button" data-w="${mon}" class="${mon===cur?'on':''} ${mon===thisW?'cur':''}">${pm}월 ${i+1}주<span>${kshort(mon)}–${kshort(addDays(mon,6))}${evn?` · 일정 ${evn}`:''}${n?` · 기록 ${n}`:''}</span></button>` }).join('');
  };
  form.querySelectorAll('[data-y]').forEach(b=>b.addEventListener('click',()=>{ py+=Number(b.dataset.y); draw() }));
  form.querySelector('#mg').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; pm=Number(b.dataset.m); draw() });
  form.querySelector('#wg').addEventListener('click',e=>{ const b=e.target.closest('[data-w]'); if(!b) return; V.week=b.dataset.w; saveView(); closeSheet(); render() });
  draw();
}

/* 설정 */
function settingsSheet(){
  const s=S.settings;
  const krow=k=>`<div class="krow" data-id="${esc(k.id)}"><span class="grip" data-grip aria-label="끌어서 순서 바꾸기">${I.grip}</span><input class="input ic" data-k="icon" value="${esc(k.icon)}" maxlength="8" aria-label="아이콘" inputmode="text"><input class="input" data-k="name" value="${esc(k.name)}" maxlength="12" placeholder="이름" aria-label="종류 이름"><button type="button" class="x" data-del aria-label="이 종류 지우기">${I.x}</button></div>`;
  const body=`
    <div class="field"><span class="k">종류 (달력에 보이는 아이콘)</span><div class="klist" id="klist">${s.kinds.map(krow).join('')}</div><div class="inline" style="margin-top:8px"><button type="button" class="btn sm" id="kAdd">${I.plus}종류 추가</button></div><div class="hint">왼쪽 칸에 이모지 하나, 오른쪽에 이름을 적어요. 왼쪽 ⋮⋮ 를 누른 채 위아래로 끌면 순서가 바뀌고, 일정 추가 창의 드롭다운 순서도 같이 바뀌어요. 지운 종류의 일정은 "일반"으로 바뀌고 일정 자체는 남아요.</div></div>
    <div class="toggle" style="margin-top:14px"><div><div class="l">공휴일 표시</div><div class="h">설날·추석·대체공휴일까지 2030년분이 들어 있어요</div></div><button type="button" class="switch ${s.holidays?'on':''}" id="holSw" role="switch" aria-checked="${s.holidays}" aria-label="공휴일 표시"></button></div>
    <div class="toggle"><div><div class="l">달력을 월요일부터</div><div class="h">끄면 일요일이 첫 칸이에요. 주간 탭은 항상 월요일부터예요</div></div><button type="button" class="switch ${s.weekStart===1?'on':''}" id="wsSw" role="switch" aria-checked="${s.weekStart===1}" aria-label="달력을 월요일부터"></button></div>
    ${field('화면 테마',`<select class="input" name="theme"><option value="system"${s.theme==='system'?' selected':''}>기기 설정 따라가기</option><option value="light"${s.theme==='light'?' selected':''}>라이트</option><option value="dark"${s.theme==='dark'?' selected':''}>다크</option></select>`)}
    ${field('전체 삭제',`<button type="button" class="btn sm danger" id="wipeBtn">모든 일정과 기록 지우기</button>`,'백업하지 않았다면 복구할 수 없어요. 종류 설정은 남아요.')}
    <div class="hint" style="margin-top:14px">일정 ${S.events.length}개 · 한 줄 기록 ${Object.keys(S.notes).length}개 · 데이터는 이 기기 안에만 저장돼요.</div>`;
  const form=openSheet('설정',body,{submitLabel:'저장',onSubmit:f=>{
    const rows=[...f.querySelectorAll('.krow')]; const kinds=[];
    for(const r of rows){ const name=r.querySelector('[data-k=name]').value.trim().slice(0,12); const icon=firstGrapheme(r.querySelector('[data-k=icon]').value)||'📌'; if(!name){ r.querySelector('[data-k=name]').focus(); return toast('종류 이름을 입력해 주세요') } kinds.push({id:r.dataset.id,icon,name}) }
    const ids=new Set(kinds.map(k=>k.id)); let reset=0; for(const e of S.events) if(e.kind&&!ids.has(e.kind)){ e.kind=''; reset++ }
    S.settings.kinds=kinds; S.settings.theme=f.theme.value; save(); closeSheet(); render(); toast(reset?`저장했어요. 일정 ${reset}개가 일반으로 바뀌었어요`:'저장했어요');
  }});
  const kl=form.querySelector('#klist');
  form.querySelector('#kAdd').addEventListener('click',()=>{ kl.insertAdjacentHTML('beforeend',krow({id:uid(),icon:'',name:''})); const last=kl.lastElementChild; last.querySelector('[data-k=icon]').focus(); last.scrollIntoView({block:'nearest'}) });
  // 끌어서 순서 바꾸기: 손잡이를 누른 채 움직이면 행이 따라오고, 이웃 행의 절반을 넘으면 자리를 바꾼다
  let drag=null;
  kl.addEventListener('pointerdown',e=>{ const h=e.target.closest('[data-grip]'); if(!h) return; const r=h.closest('.krow'); e.preventDefault(); try{ h.setPointerCapture(e.pointerId) }catch(e2){} drag={r,h,id:e.pointerId,startY:e.clientY}; r.classList.add('dragging'); kl.classList.add('dragging-list'); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur() });
  kl.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; e.preventDefault(); const r=drag.r; const place=()=>{ r.style.transform=`translateY(${e.clientY-drag.startY}px)` }; place();
    for(let guard=0;guard<20;guard++){ const rb=r.getBoundingClientRect(); const prev=r.previousElementSibling, next=r.nextElementSibling; let moved=false;
      if(prev){ const pb=prev.getBoundingClientRect(); if(rb.top+rb.height/2<pb.top+pb.height/2){ const before=rb.top; kl.insertBefore(r,prev); const after=r.getBoundingClientRect().top; drag.startY+=after-before; place(); moved=true } }
      if(!moved&&next){ const nb=next.getBoundingClientRect(); if(rb.top+rb.height/2>nb.top+nb.height/2){ const before=rb.top; kl.insertBefore(next,r); const after=r.getBoundingClientRect().top; drag.startY+=after-before; place(); moved=true } }
      if(!moved) break } });
  const endDrag=e=>{ if(!drag||(e&&e.pointerId!==drag.id)) return; drag.r.style.transform=''; drag.r.classList.remove('dragging'); kl.classList.remove('dragging-list'); drag=null };
  kl.addEventListener('pointerup',endDrag); kl.addEventListener('pointercancel',endDrag);
  kl.addEventListener('click',e=>{
    const b=e.target.closest('[data-del]'); if(!b) return; const r=b.closest('.krow'); const used=S.events.filter(x=>x.kind===r.dataset.id).length;
    if(used&&!b.dataset.armed){ b.dataset.armed='1'; toast(`이 종류를 쓰는 일정이 ${used}개 있어요. 한 번 더 누르면 지워요`); setTimeout(()=>{ delete b.dataset.armed },3000); return }
    r.remove() });
  kl.addEventListener('input',e=>{ if(e.target.dataset.k!=='icon') return; const g=firstGrapheme(e.target.value); if(g&&e.target.value.trim()!==g) e.target.value=g });
  const hs=form.querySelector('#holSw'), ws=form.querySelector('#wsSw');
  hs.addEventListener('click',()=>{ S.settings.holidays=!S.settings.holidays; hs.classList.toggle('on',S.settings.holidays); hs.setAttribute('aria-checked',S.settings.holidays); save(); render() });
  ws.addEventListener('click',()=>{ S.settings.weekStart=S.settings.weekStart===1?0:1; ws.classList.toggle('on',S.settings.weekStart===1); ws.setAttribute('aria-checked',S.settings.weekStart===1); save(); render() });
  form.theme.addEventListener('change',()=>{ S.settings.theme=form.theme.value; applyTheme() });
  const wb=form.querySelector('#wipeBtn');
  wb.addEventListener('click',()=>{ if(!wb.dataset.armed){wb.dataset.armed='1';wb.textContent='정말 모두 지우기';return} S.events=[]; S.notes={}; S.sampleNotes=[]; save(); closeSheet(); render(); toast('모든 일정과 기록을 지웠어요') });
}
function applyTheme(){ const th=S.settings.theme; if(th==='light'||th==='dark') document.documentElement.setAttribute('data-theme',th); else document.documentElement.removeAttribute('data-theme') }

/* 백업 */
function backupSheet(){
  const notes={}; for(const [d,v] of Object.entries(S.notes)) if(!S.sampleNotes.includes(d)) notes[d]=v;
  const json=JSON.stringify({app:'sched-cal',version:2,exportedAt:new Date().toISOString(),settings:S.settings,events:S.events.filter(e=>!e.sample),notes});
  const fname=`일정달력-${today()}.json`;
  const nEv=S.events.filter(e=>!e.sample).length, nNote=Object.keys(notes).length;
  const body=`<div class="small muted">데이터는 이 폰의 브라우저 안에만 있어요. 폰을 바꾸거나 브라우저 데이터를 지우면 사라지니 가끔 백업해 두세요. 폰에서는 "파일로 공유"가 제일 편해요. AirDrop이나 카카오톡 나에게 보내기, iCloud Drive로 보낼 수 있어요.</div>
  ${field('내보내기',`<div class="inline"><button type="button" class="btn sm primary" id="shareBtn">파일로 공유</button><button type="button" class="btn sm" id="copyBtn">전체 복사</button><button type="button" class="btn sm ghost" id="dlBtn">파일로 저장</button></div><textarea class="input mono" id="exportBox" readonly rows="3" style="margin-top:8px">${esc(json)}</textarea>`,`일정 ${nEv}개 · 한 줄 기록 ${nNote}개 · 종류 설정 포함 · ${Math.max(1,Math.round(json.length/1024))}KB · ${esc(fname)}`)}
  ${field('가져오기',`<div class="inline"><label class="btn sm" style="cursor:pointer">파일 불러오기<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden></label></div><textarea class="input mono" id="importBox" rows="3" placeholder="또는 백업해 둔 내용을 붙여넣기" style="margin-top:8px"></textarea><div class="inline" style="margin-top:8px"><button type="button" class="btn sm" id="mergeBtn">합치기</button><button type="button" class="btn sm danger" id="replaceBtn">전체 덮어쓰기</button></div>`,'파일을 고르거나 붙여넣은 뒤 합치기 또는 덮어쓰기를 눌러요. 합치기는 이미 있는 일정·기록은 건너뛰고 새것만 추가해요')}`;
  const form=openSheet('백업',body,{submitLabel:'닫기',onSubmit:()=>closeSheet()});
  form.querySelector('.sheet-f .btn.primary').classList.replace('primary','ghost');
  form.querySelector('#copyBtn').addEventListener('click',async()=>{ const box=form.querySelector('#exportBox'); try{await navigator.clipboard.writeText(json);toast('복사했어요')}catch(e){box.select();try{document.execCommand('copy');toast('복사했어요')}catch(e2){toast('길게 눌러 직접 복사해 주세요')}} });
  form.querySelector('#dlBtn').addEventListener('click',()=>{ try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=fname;a.click();toast('저장을 시작했어요. 안 되면 파일로 공유나 복사를 써 주세요')}catch(e){toast('이 환경에선 파일 저장이 막혀 있어요. 파일로 공유나 복사를 써 주세요')} });
  form.querySelector('#shareBtn').addEventListener('click',async()=>{ try{ const file=new File([json],fname,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'일정 달력 백업'}); toast('공유 창을 열었어요') } else if(navigator.share){ await navigator.share({title:'일정 달력 백업',text:json}); toast('텍스트로 공유했어요') } else toast('이 브라우저는 공유를 지원하지 않아요. 복사나 파일 저장을 써 주세요') }catch(e){ if(e&&e.name!=='AbortError') toast('공유하지 못했어요. 복사나 파일 저장을 써 주세요') } });
  form.querySelector('#importFile').addEventListener('change',ev=>{ const f=ev.target.files&&ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ form.querySelector('#importBox').value=String(r.result||''); toast(`${f.name} 읽었어요. 합치기 또는 덮어쓰기를 눌러 주세요`) }; r.onerror=()=>toast('파일을 읽지 못했어요'); r.readAsText(f) });
  const parseIn=()=>{ try{ const d=JSON.parse(form.querySelector('#importBox').value); if(!d||!Array.isArray(d.events)) throw 0; return migrate(d) }catch(e){ toast('형식이 맞지 않아요. 백업한 내용 전체를 붙여넣어 주세요'); return null } };
  form.querySelector('#mergeBtn').addEventListener('click',()=>{ const d=parseIn(); if(!d) return; let n=0,m=0; for(const k of d.settings.kinds) if(!S.settings.kinds.some(x=>x.id===k.id)) S.settings.kinds.push(k); for(const e of d.events){ if(S.events.some(x=>x.id===e.id)) continue; S.events.push(e); n++ } for(const [k,v] of Object.entries(d.notes)){ if(S.notes[k]) continue; S.notes[k]=v; m++ } save(); closeSheet(); render(); toast(`일정 ${n}개, 기록 ${m}개를 가져왔어요`) });
  const rb=form.querySelector('#replaceBtn'); rb.addEventListener('click',()=>{ if(!rb.dataset.armed){rb.dataset.armed='1';rb.textContent='정말 덮어쓰기';return} const d=parseIn(); if(!d) return; d.settings=Object.assign({},S.settings,d.settings||{}); S=d; save(); closeSheet(); render(); toast('덮어썼어요') });
}

/* ====================== 토스트 ====================== */
let toastTimer=null;
function toast(msg){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{r.innerHTML=''},2400) }

/* ====================== 액션 ====================== */
function shiftMonth(n){ const [y,m]=V.month.split('-').map(Number); const d=new Date(y,m-1+n,1); V.month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; V.sel=V.month===today().slice(0,7)?today():V.month+'-01'; saveView(); render() }
function shiftWeek(n){ V.week=addDays(V.week||mondayOf(today()),7*n); saveView(); render() }
const ACTIONS={
  'tab':d=>{ V.tab=d.tab; saveView(); render(); window.scrollTo(0,0) },
  'search':()=>searchSheet(),
  'pick-month':()=>monthPicker(),
  'pick-week':()=>weekPicker(),
  'backup':()=>backupSheet(),
  'settings':()=>settingsSheet(),
  'month-prev':()=>shiftMonth(-1),
  'month-next':()=>shiftMonth(1),
  'month-today':()=>{ V.month=today().slice(0,7); V.sel=today(); saveView(); render() },
  'week-prev':()=>shiftWeek(-1),
  'week-next':()=>shiftWeek(1),
  'week-today':()=>{ V.week=mondayOf(today()); saveView(); render() },
  'day':d=>{ if(V.sel===d.date){ editSheet(newEvent(d.date),{isNew:true}); return } V.sel=d.date; if(d.date.slice(0,7)!==V.month){ V.month=d.date.slice(0,7) } saveView(); render() },
  'edit':d=>{ const ev=S.events.find(q=>q.id===d.id); if(ev) editSheet(ev) },
  'note':d=>noteSheet(d.date),
  'add':d=>{ let date=d.date; if(!date){ if(V.tab==='week'){ const mon=V.week||mondayOf(today()); const t=today(); date=(t>=mon&&t<=addDays(mon,6))?t:mon } else date=V.sel } editSheet(newEvent(date),{isNew:true}) },
  'clear-sample':()=>{ S.events=S.events.filter(e=>!e.sample); for(const d of S.sampleNotes) delete S.notes[d]; S.sampleNotes=[]; save(); render(); toast('예시를 지웠어요') },
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const fn=ACTIONS[b.dataset.act]; if(fn) fn(b.dataset) });

/* 날짜가 바뀌면(자정 지나거나 다시 열 때) 다시 그리기 */
let lastDay=today();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&today()!==lastDay){ lastDay=today(); render() } });

/* ====================== 시작 ====================== */
S=load(); if(!S){ S=seed(); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
V=loadView();
render();
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(e){} }
</script>
