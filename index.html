<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>일정 달력</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="일정 달력">
<meta name="theme-color" content="#2E6B4E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface2:#E8ECE6; --ink:#1B1F1C; --muted:#687069; --line:#D8DDD4;
  --accent:#2E6B4E; --accent-ink:#FFFFFF; --accent-soft:#DFEEE5; --accent-deep:#1F4D37;
  --sun:#C2453A; --sat:#3A5FB3; --hol:#C2453A;
  --warn:#9A6A12; --warn-soft:#F6EDD6; --neg:#B23F2E;
  --c-green:#2E6B4E; --c-green-soft:#DFEEE5;
  --c-blue:#3568B5; --c-blue-soft:#E1EAF8;
  --c-orange:#C96A1F; --c-orange-soft:#F8E7D7;
  --c-purple:#7A4FA6; --c-purple-soft:#EEE6F6;
  --c-rose:#C4445E; --c-rose-soft:#FBE4E9;
  --c-gray:#5F6762; --c-gray-soft:#E6EAE5;
  --shadow:0 10px 30px rgba(27,31,28,.14);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131614; --surface:#1B1F1C; --surface2:#252A26; --ink:#ECEFEA; --muted:#9AA39C; --line:#333933;
    --accent:#7FC9A2; --accent-ink:#0E2219; --accent-soft:#1D3A2C; --accent-deep:#A9DCC0;
    --sun:#F08A80; --sat:#8FAEF0; --hol:#F08A80;
    --warn:#E2B55A; --warn-soft:#3A2F15; --neg:#E8806F;
    --c-green:#7FC9A2; --c-green-soft:#1D3A2C;
    --c-blue:#8FB1F2; --c-blue-soft:#1F2B45;
    --c-orange:#E8A25F; --c-orange-soft:#3A2A16;
    --c-purple:#C1A1E6; --c-purple-soft:#2D2238;
    --c-rose:#E8738C; --c-rose-soft:#3B2028;
    --c-gray:#AEB6AF; --c-gray-soft:#2C312D;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#131614; --surface:#1B1F1C; --surface2:#252A26; --ink:#ECEFEA; --muted:#9AA39C; --line:#333933;
  --accent:#7FC9A2; --accent-ink:#0E2219; --accent-soft:#1D3A2C; --accent-deep:#A9DCC0;
  --sun:#F08A80; --sat:#8FAEF0; --hol:#F08A80;
  --warn:#E2B55A; --warn-soft:#3A2F15; --neg:#E8806F;
  --c-green:#7FC9A2; --c-green-soft:#1D3A2C;
  --c-blue:#8FB1F2; --c-blue-soft:#1F2B45;
  --c-orange:#E8A25F; --c-orange-soft:#3A2A16;
  --c-purple:#C1A1E6; --c-purple-soft:#2D2238;
  --c-rose:#E8738C; --c-rose-soft:#3B2028;
  --c-gray:#AEB6AF; --c-gray-soft:#2C312D;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{overflow-x:hidden;max-width:100vw}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* 16px 미만이면 아이폰이 입력칸을 누를 때 자동 확대함 */
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* 색 토큰: 일정 색은 .c-* 클래스로 --c / --c-soft 두 변수만 바꿔서 쓴다 */
.c-green{--c:var(--c-green);--c-soft:var(--c-green-soft)}
.c-blue{--c:var(--c-blue);--c-soft:var(--c-blue-soft)}
.c-orange{--c:var(--c-orange);--c-soft:var(--c-orange-soft)}
.c-purple{--c:var(--c-purple);--c-soft:var(--c-purple-soft)}
.c-rose{--c:var(--c-rose);--c-soft:var(--c-rose-soft)}
.c-gray{--c:var(--c-gray);--c-soft:var(--c-gray-soft)}

#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@media (min-width:600px){ body{background:var(--surface2)} #app{box-shadow:0 0 0 1px var(--line);min-height:100vh} }

.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.topbar h1 .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink);background:transparent;flex:0 0 auto}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 8px}
.page{padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--surface2);color:var(--ink);border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;color:var(--neg);border-color:var(--line)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;flex:0 0 auto}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 예시 안내 */
.notice{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500;display:flex;gap:10px;align-items:center;line-height:1.45}
.notice span{flex:1}
.notice button{color:inherit;font-weight:700;text-decoration:underline;white-space:nowrap}

/* 요약 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:12px 16px 0}
.summary > div{background:var(--surface);padding:10px 12px;min-width:0}
.summary .k{font-size:11.5px;color:var(--muted);font-weight:500}
.summary .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .v small{font-size:12px;font-weight:500;color:var(--muted);font-family:var(--sans);margin-left:2px}
.summary .k.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* 달력 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px 8px;margin:12px 16px 0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 4px}
.cal-title{font-weight:600;font-size:16px;display:flex;align-items:baseline;gap:6px;padding:4px 8px;margin-left:-2px;border-radius:10px}
.cal-title:hover{background:var(--surface2)}
.cal-title .y{font-size:12.5px;color:var(--muted);font-family:var(--mono);font-weight:500}
.cal-title svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;align-self:center}
.cal-nav{display:flex;align-items:center;gap:2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.wk .su{color:var(--sun)} .wk .sa{color:var(--sat)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{position:relative;min-height:78px;display:flex;flex-direction:column;padding:3px 2px 3px;border-radius:10px;color:var(--ink);text-align:center;overflow:hidden}
.day.out{opacity:.38}
.day .n{font-family:var(--mono);font-size:13px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin:0 auto 2px;flex:0 0 auto}
.day.su .n,.day.hol .n{color:var(--sun)} .day.sa .n{color:var(--sat)}
.day.today .n{background:var(--accent);color:var(--accent-ink);font-weight:600}
.day.sel{background:var(--accent-soft)}
.day.sel.today .n{box-shadow:0 0 0 2px var(--surface)}
.ev{display:block;font-style:normal;font-size:9.5px;line-height:14px;height:14px;margin:0 0 2px;padding:0 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;text-align:left;background:var(--c-soft);color:var(--c)}
.ev.span{margin-left:-2px;margin-right:-2px;border-radius:0}
.ev.span.ms{margin-left:0;border-radius:3px 0 0 3px}
.ev.span.me{margin-right:0;border-radius:0 3px 3px 0}
.ev.span.ms.me{margin:0;border-radius:3px}
.ev.timed{background:transparent;color:var(--ink);padding-left:1px}
.ev.timed::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin:0 3px 1px 0;vertical-align:middle}
.ev.hol{background:transparent;color:var(--hol);text-align:center;padding:0;font-weight:600}
.more{display:block;font-style:normal;font-size:9.5px;line-height:14px;height:14px;color:var(--muted);text-align:left;padding-left:3px;font-weight:600;font-family:var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 4px 2px;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;font-style:normal}
.legend .l-a{background:var(--accent-soft);border:1px solid var(--accent)} .legend .l-d{border-radius:50%;width:7px;height:7px;background:var(--ink)} .legend .l-h{background:transparent;color:var(--hol);width:auto;height:auto;font-weight:700;font-size:11px}

/* 일정 목록 */
.dayhead{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.dayhead .d{font-weight:600;font-size:14.5px}
.dayhead .d.today{color:var(--accent)}
.dayhead .h{font-size:12.5px;color:var(--hol);font-weight:600}
.dayhead .c{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 16px}
.list + .list-gap{height:16px}
.erow{display:grid;grid-template-columns:4px 62px 1fr auto;gap:0 10px;align-items:center;width:100%;text-align:left;padding:11px 14px 11px 12px;border-top:1px solid var(--line);color:var(--ink)}
.erow:first-child{border-top:0}
.erow:hover{background:var(--surface2)}
.erow .stripe{width:4px;align-self:stretch;min-height:32px;border-radius:2px;background:var(--c)}
.erow .et{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden}
.erow .et b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.erow .em{min-width:0}
.erow .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.erow .t svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.erow .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .dd{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--c);background:var(--c-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.erow .dd.now{color:var(--accent-ink);background:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.selbox{margin:16px 16px 0}
.selbox .dayhead{padding-left:4px}
.addrow{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:14px;text-align:left}
.addrow:first-child{border-top:0}
.addrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:500}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* 목록 탭 */
.search{display:flex;align-items:center;gap:8px;margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 10px 0 12px;min-height:46px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;outline:none}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--muted)}
.search .clr{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface2);flex:0 0 auto}
.search .clr svg{width:14px;height:14px;stroke:currentColor}
.rescount{padding:12px 20px 0;font-size:12.5px;color:var(--muted);font-weight:500}
.rescount b{color:var(--ink);font-family:var(--mono)}
mark{background:transparent;color:var(--accent);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.group{margin-top:16px}
.group .dayhead{padding:0 20px 6px}

/* 시트 */
.overlay{position:fixed;inset:0;background:rgba(14,20,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.overlay,.sheet,.toast{animation:none}}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);max-height:92dvh;display:flex;flex-direction:column;animation:up .2s ease}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.sheet-h h2{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{padding:6px 16px 12px;overflow-y:auto;overscroll-behavior:contain}
.sheet-f{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.sheet-f .btn.danger{flex:0 0 auto}
.field{margin-top:12px}
.field label.k,.field .k{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;min-height:44px}
.input.mono{font-family:var(--mono);font-size:16px;line-height:1.4}
textarea.input{resize:vertical;min-height:60px;line-height:1.4}
input[type=date].input,input[type=time].input{font-family:var(--mono);display:block;min-width:0;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.infobox{background:var(--accent-soft);color:var(--accent-deep);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-top:12px;line-height:1.5}
.infobox.plain{background:var(--surface2);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 0;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cchips{display:flex;gap:8px;flex-wrap:wrap}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;position:relative}
.cchip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.cchip i{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block}
.cchip:has(input:checked){background:var(--c-soft);border-color:var(--c);color:var(--c)}
.cchip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle .l{font-weight:500;font-size:15px}
.toggle .h{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);flex:0 0 auto;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(20px)}

/* 연/월 선택 */
.yrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.yrow .yl{font-family:var(--mono);font-size:20px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mgrid button{position:relative;padding:14px 0;border-radius:12px;background:var(--surface2);font-weight:600;font-size:15px;color:var(--ink)}
.mgrid button.on{background:var(--accent);color:var(--accent-ink)}
.mgrid button.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.mgrid button.has::after{content:"";position:absolute;left:50%;bottom:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.mgrid button.on.has::after{background:var(--accent-ink)}

/* 탭바 + 추가 버튼 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(16px,calc(50% - 240px + 16px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* 토스트 */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);animation:fade .15s ease;max-width:86vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1><span class="dot"></span>일정 달력</h1>
    <button type="button" class="iconbtn" data-act="backup" aria-label="백업" title="백업">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
    <button type="button" class="iconbtn" data-act="settings" aria-label="설정" title="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="main"></main>
  <button type="button" class="fab" data-act="add" aria-label="일정 추가" title="일정 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ====================== 저장 ====================== */
const KEY='sched-cal.v1';
const COLORS=[['green','숲'],['blue','바다'],['orange','살구'],['purple','포도'],['rose','장미'],['gray','잿빛']];
const REPEATS=[['none','반복 없음'],['weekly','매주'],['monthly','매월'],['yearly','매년']];
const repeatName=k=>(REPEATS.find(r=>r[0]===k)||REPEATS[0])[1];
const DEF=()=>({version:1,events:[],settings:{theme:'system',weekStart:0,holidays:true}});
let S, V;
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY) }catch(e){ return null }
  if(!raw) return null; // 처음 열었을 때
  try{ return migrate(JSON.parse(raw)) }
  catch(e){ try{localStorage.setItem(KEY+'.broken.'+Date.now(),raw)}catch(e2){} return DEF() }
}
function migrate(d){
  if(!d||typeof d!=='object') d={};
  d.version=1;
  const colorOk=new Set(COLORS.map(c=>c[0])), repOk=new Set(REPEATS.map(r=>r[0]));
  d.events=(Array.isArray(d.events)?d.events:[]).filter(e=>e&&isDate(e.start)&&String(e.title||'').trim()).map(e=>{
    const end=isDate(e.end)&&e.end>e.start?e.end:null;
    const allDay=e.allDay!==false&&!e.time;
    return {id:String(e.id||uid()),title:String(e.title).trim().slice(0,60),start:e.start,end,allDay,
      time:allDay?'':(isTime(e.time)?e.time:''),endTime:allDay?'':(isTime(e.endTime)?e.endTime:''),
      color:colorOk.has(e.color)?e.color:'green',place:String(e.place||'').slice(0,80),memo:String(e.memo||'').slice(0,500),
      repeat:repOk.has(e.repeat)?e.repeat:'none',sample:!!e.sample};
  });
  d.settings=Object.assign({theme:'system',weekStart:0,holidays:true},d.settings||{});
  d.settings.weekStart=d.settings.weekStart===1?1:0; d.settings.holidays=d.settings.holidays!==false;
  sortE(d); return d;
}
function sortE(d){ d.events.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.time||'').localeCompare(b.time||'')) }
function save(){ sortE(S); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장하지 못했어요. 저장 공간을 확인해 주세요')} }
function loadView(){ try{ const v=JSON.parse(localStorage.getItem(KEY+'.view')); if(v&&/^\d{4}-\d{2}$/.test(v.month)){ if(!isDate(v.sel)) v.sel=today(); return v } }catch(e){} return {month:today().slice(0,7),sel:today(),tab:'cal',list:'upcoming'} }
function saveView(){ try{localStorage.setItem(KEY+'.view',JSON.stringify(V))}catch(e){} }
// 처음 열면 예시 일정을 넣어 어떻게 보이는지 보여준다. 전부 sample 표시가 있어 한 번에 지울 수 있다
function seed(){
  const t=today(), d=parse(t);
  const dom25=`${d.getFullYear()}-${pad(d.getMonth()+1)}-25`;
  const mk=(o)=>Object.assign({id:uid(),end:null,allDay:true,time:'',endTime:'',color:'green',place:'',memo:'',repeat:'none',sample:true},o);
  const s=DEF();
  s.events=[
    mk({title:'치과 정기검진',start:addDays(t,1),allDay:false,time:'14:00',endTime:'15:00',color:'blue',place:'역 앞 치과',memo:'보험 카드 챙기기'}),
    mk({title:'친구들과 저녁',start:addDays(t,3),allDay:false,time:'19:00',color:'orange',place:'성수동'}),
    mk({title:'제주 여행',start:addDays(t,10),end:addDays(t,12),color:'green',memo:'렌터카 예약 확인'}),
    mk({title:'엄마 생일',start:addDays(t,24),color:'rose',repeat:'yearly'}),
    mk({title:'월세 이체',start:dom25,color:'gray',repeat:'monthly',memo:'매달 25일'}),
  ];
  return migrate(s);
}

/* ====================== 날짜 ====================== */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s).getTime());
const isTime=s=>typeof s==='string'&&/^\d{2}:\d{2}$/.test(s);
const dim=(y,m0)=>new Date(y,m0+1,0).getDate();
const WD=['일','월','화','수','목','금','토'];
function kdate(s,withYear){ const d=parse(s); return `${withYear?d.getFullYear()+'년 ':''}${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})` }
function kshort(s){ const d=parse(s); return `${d.getMonth()+1}.${d.getDate()}` }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function relDay(n){ if(n===0) return '오늘'; if(n===1) return '내일'; if(n===2) return '내일모레'; if(n===-1) return '어제'; return n>0?`D-${n}`:`${-n}일 전` }

/* ====================== 공휴일 (대한민국) ====================== */
// 설날 당일 · 부처님오신날 · 추석 당일의 양력 날짜. 표에 없는 해는 양력 공휴일만 표시한다
const LUNAR={2024:['02-10','05-15','09-17'],2025:['01-29','05-05','10-06'],2026:['02-17','05-24','09-25'],2027:['02-07','05-13','09-15'],2028:['01-26','05-02','10-03'],2029:['02-13','05-20','09-22'],2030:['02-03','05-09','09-12']};
const HOL_CACHE={};
function holidays(y){
  if(HOL_CACHE[y]) return HOL_CACHE[y];
  const list=[]; // {d,n,sub:대체공휴일 대상인지, sat:토요일도 대체하는지}
  const fixed=[['01-01','신정',false,false],['03-01','삼일절',true,true],['05-05','어린이날',true,true],['06-06','현충일',false,false],['08-15','광복절',true,true],['10-03','개천절',true,true],['10-09','한글날',true,true],['12-25','성탄절',true,true]];
  for(const [md,n,sub,sat] of fixed) list.push({d:`${y}-${md}`,n,sub,sat});
  const L=LUNAR[y];
  if(L){
    const sl=`${y}-${L[0]}`, bd=`${y}-${L[1]}`, ch=`${y}-${L[2]}`;
    for(const k of [-1,0,1]) list.push({d:addDays(sl,k),n:'설날',sub:true,sat:false});
    list.push({d:bd,n:'부처님오신날',sub:true,sat:true});
    for(const k of [-1,0,1]) list.push({d:addDays(ch,k),n:'추석',sub:true,sat:false});
  }
  const map=new Map(); for(const h of list) if(!map.has(h.d)) map.set(h.d,h.n);
  // 대체공휴일: 일요일(일부는 토요일도)이거나 다른 공휴일과 겹치면, 그 다음 평일 하루를 쉰다. 겹친 날은 하루만 추가한다
  const byDate=new Map(); for(const h of list) (byDate.get(h.d)||byDate.set(h.d,[]).get(h.d)).push(h);
  for(const d of [...byDate.keys()].sort()){
    const hs=byDate.get(d); if(!hs.some(h=>h.sub)) continue;
    const dow=parse(d).getDay();
    const need=dow===0||(dow===6&&hs.some(h=>h.sub&&h.sat))||hs.length>1;
    if(!need) continue;
    let s=addDays(d,1); while(map.has(s)||[0,6].includes(parse(s).getDay())) s=addDays(s,1);
    map.set(s,'대체공휴일');
  }
  HOL_CACHE[y]=map; return map;
}
const holidayOf=d=>S.settings.holidays?(holidays(parse(d).getFullYear()).get(d)||null):null;

/* ====================== 일정 전개 ====================== */
// 한 일정이 [from,to] 사이에 나타나는 날짜들을 돌려준다. 반복 일정은 여기서 펼친다
function occursIn(ev,from,to){
  const len=ev.end?diff(ev.start,ev.end):0;
  const out=[]; const push=s=>{ const e=addDays(s,len); if(e>=from&&s<=to) out.push({ev,start:s,end:e,len}) };
  if(ev.repeat==='none'){ push(ev.start); return out }
  const sd=parse(ev.start);
  if(ev.repeat==='weekly'){
    let s=ev.start; if(s<from){ const k=Math.max(0,Math.floor((diff(s,from)-len)/7)); s=addDays(s,k*7) }
    for(;s<=to;s=addDays(s,7)) push(s); return out;
  }
  if(ev.repeat==='monthly'){
    let y=sd.getFullYear(), m=sd.getMonth();
    const f=parse(from); let fy=f.getFullYear(), fm=f.getMonth()-1; if(fm<0){fm=11;fy--}
    if(y*12+m<fy*12+fm){ y=fy; m=fm }
    for(let i=0;i<600;i++){ const s=`${y}-${pad(m+1)}-${pad(Math.min(sd.getDate(),dim(y,m)))}`; if(s>to) break; if(s>=ev.start) push(s); m++; if(m>11){m=0;y++} }
    return out;
  }
  if(ev.repeat==='yearly'){
    const toY=Number(to.slice(0,4));
    for(let y=Math.max(sd.getFullYear(),Number(from.slice(0,4))-1);y<=toY;y++){ const s=`${y}-${pad(sd.getMonth()+1)}-${pad(Math.min(sd.getDate(),dim(y,sd.getMonth())))}`; if(s>=ev.start) push(s) }
    return out;
  }
  return out;
}
function occurrences(from,to){
  const all=[]; for(const ev of S.events) all.push(...occursIn(ev,from,to));
  // 여러 날 일정 → 하루 종일 → 시간순
  all.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(b.len-a.len)||((a.ev.allDay?0:1)-(b.ev.allDay?0:1))||(a.ev.time||'').localeCompare(b.ev.time||'')||a.ev.title.localeCompare(b.ev.title,'ko'));
  return all;
}
function dayOccurrences(d){ return occurrences(d,d) }
function timeLabel(o){
  const ev=o.ev;
  if(o.len>0) return `${kshort(o.start)}–${kshort(o.end)}`;
  if(ev.allDay) return '하루 종일';
  return ev.time+(ev.endTime?`–${ev.endTime}`:'');
}

/* ====================== 렌더 ====================== */
const I={
  repeat:'<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
function render(){
  applyTheme();
  const tab=V.tab||'cal';
  document.getElementById('main').innerHTML=(S.events.some(e=>e.sample)?sampleNotice():'')+(tab==='list'?listPage():summary()+calendar()+selectedDay());
  document.getElementById('tabbar').innerHTML=`
    <button type="button" class="${tab==='cal'?'on':''}" data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
    <button type="button" class="${tab==='list'?'on':''}" data-act="tab" data-tab="list"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/><circle cx="19" cy="18" r="1" fill="currentColor"/></svg>목록</button>`;
}
function sampleNotice(){
  const n=S.events.filter(e=>e.sample).length;
  return `<div class="notice"><span>예시 일정 ${n}개가 들어 있어요. 눌러서 어떻게 보이는지 살펴본 뒤 지우고 진짜 일정을 넣어 보세요.</span><button type="button" data-act="clear-sample">예시 지우기</button></div>`;
}
function summary(){
  const t=today();
  const todayN=dayOccurrences(t).length;
  const [y,m]=V.month.split('-').map(Number);
  const mFrom=`${y}-${pad(m)}-01`, mTo=`${y}-${pad(m)}-${pad(dim(y,m-1))}`;
  const monthN=occurrences(mFrom,mTo).filter(o=>o.start>=mFrom).length;
  const hm=nowHM();
  const next=occurrences(t,addDays(t,366)).find(o=>o.start>t||(o.start===t&&(o.ev.allDay||(o.ev.time&&o.ev.time>=hm))));
  let nv='-', nk='예정된 일정 없음';
  if(next){ const n=diff(t,next.start); nv=n===0?'오늘':n===1?'내일':`D-${n}`; nk=next.ev.title }
  return `<section class="summary">
    <div><div class="k">오늘</div><div class="v">${todayN}<small>개</small></div><div class="k t">${esc(kdate(t))}</div></div>
    <div><div class="k">${m}월</div><div class="v">${monthN}<small>개</small></div><div class="k t">시작일 기준</div></div>
    <div><div class="k">다음 일정</div><div class="v">${esc(nv)}</div><div class="k t">${esc(nk)}</div></div>
  </section>`;
}
function calendar(){
  const [y,m]=V.month.split('-').map(Number);
  const t=today(), ws=S.settings.weekStart;
  const firstDow=new Date(y,m-1,1).getDay();
  const lead=(firstDow-ws+7)%7;
  const total=Math.ceil((lead+dim(y,m-1))/7)*7;
  const first=addDays(`${y}-${pad(m)}-01`,-lead), last=addDays(first,total-1);
  // 날짜별 일정 묶기
  const dmap=new Map();
  for(const o of occurrences(first,last)){
    const a=o.start<first?first:o.start, b=o.end>last?last:o.end;
    for(let d=a;d<=b;d=addDays(d,1)) (dmap.get(d)||dmap.set(d,[]).get(d)).push(o);
  }
  const wdays=[]; for(let i=0;i<7;i++){ const k=(ws+i)%7; wdays.push(`<span class="${k===0?'su':k===6?'sa':''}">${WD[k]}</span>`) }
  let cells='';
  for(let i=0;i<total;i++){
    const d=addDays(first,i), dd=parse(d), dow=dd.getDay(), inMonth=dd.getMonth()===m-1;
    const hol=holidayOf(d);
    const cls=['day']; if(!inMonth) cls.push('out'); if(dow===0) cls.push('su'); if(dow===6) cls.push('sa'); if(hol) cls.push('hol'); if(d===t) cls.push('today'); if(d===V.sel) cls.push('sel');
    const occ=dmap.get(d)||[];
    const room=hol?2:3; // 한 칸에 보이는 줄 수
    let lines=hol?`<i class="ev hol">${esc(hol)}</i>`:'';
    const shown=occ.length>room?room-1:occ.length;
    for(let k=0;k<shown;k++){
      const o=occ[k], ev=o.ev;
      if(o.len>0){ const ms=o.start===d, me=o.end===d; const label=(ms||dow===ws)?esc(ev.title):'&nbsp;'; lines+=`<i class="ev span c-${ev.color} ${ms?'ms':''} ${me?'me':''}">${label}</i>` }
      else if(ev.allDay) lines+=`<i class="ev c-${ev.color}">${esc(ev.title)}</i>`;
      else lines+=`<i class="ev timed c-${ev.color}">${esc(ev.title)}</i>`;
    }
    if(occ.length>shown) lines+=`<i class="more">+${occ.length-shown}</i>`;
    const label=`${kdate(d,true)}${hol?' '+hol:''}${occ.length?` 일정 ${occ.length}개`:''}`;
    cells+=`<button type="button" class="${cls.join(' ')}" data-act="day" data-date="${d}" aria-label="${esc(label)}"><span class="n">${dd.getDate()}</span>${lines}</button>`;
  }
  const isThisMonth=V.month===t.slice(0,7);
  return `<section class="cal">
    <div class="cal-head">
      <button type="button" class="cal-title" data-act="pick-month" aria-label="연도와 월 선택">${m}월 <span class="y">${y}</span>${I.down}</button>
      <div class="cal-nav">
        ${isThisMonth?'':'<button type="button" class="btn sm ghost" data-act="month-today">오늘</button>'}
        <button type="button" class="iconbtn" data-act="month-prev" aria-label="이전 달">${I.prev}</button>
        <button type="button" class="iconbtn" data-act="month-next" aria-label="다음 달">${I.next}</button>
      </div>
    </div>
    <div class="wk">${wdays.join('')}</div>
    <div class="days">${cells}</div>
    <div class="legend"><span><i class="l-a"></i>하루 종일·여러 날</span><span><i class="l-d"></i>시간 있는 일정</span>${S.settings.holidays?'<span><i class="l-h">공휴일</i></span>':''}</div>
  </section>`;
}
function eventRow(o,{dday=false,q=''}={}){
  const ev=o.ev, t=today();
  const sub=[ev.place,ev.memo.split('\n')[0]].filter(Boolean).map(v=>hl(v,q)).join(' · ');
  let dd='';
  if(dday){
    const n=diff(t,o.start);
    if(o.start<=t&&t<=o.end) dd=`<span class="dd now">${o.len>0?'진행 중':'오늘'}</span>`;
    else dd=`<span class="dd">${esc(relDay(n))}</span>`;
  }
  const tl=timeLabel(o); const [big,small]=o.len>0?[tl,ev.time?`${ev.time}${ev.endTime?'–'+ev.endTime:''}`:'']:ev.allDay?['',tl]:[ev.time,ev.endTime?`–${ev.endTime}`:''];
  return `<button type="button" class="erow c-${ev.color}" data-act="edit" data-id="${ev.id}" data-date="${o.start}">
    <span class="stripe"></span>
    <div class="et">${big?`<b>${esc(big)}</b>`:''}${small?esc(small):''}</div>
    <div class="em"><div class="t"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis">${hl(ev.title,q)}</span>${ev.repeat!=='none'?I.repeat:''}${ev.sample?'<span class="pill warn">예시</span>':''}</div>${sub?`<div class="s">${sub}</div>`:''}</div>
    ${dd}
  </button>`;
}
function selectedDay(){
  const d=V.sel, t=today(), hol=holidayOf(d);
  const occ=dayOccurrences(d);
  const rows=occ.map(o=>eventRow(o)).join('');

    <div class="dayhead"><span class="d ${d===t?'today':''}">${esc(kdate(d))}${d===t?' · 오늘':''}</span>${hol?`<span class="h">${esc(hol)}</span>`:''}<span class="c">${occ.length?`${occ.length}개`:''}</span></div>
    <div class="list">${rows||`<div class="empty">이 날은 일정이 없어요</div>`}<button type="button" class="addrow" data-act="add" data-date="${d}">${I.plus}이 날에 일정 추가</button></div>
  </section>`;

let Q=''; // 목록 검색어 (화면을 닫으면 지워진다)
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function hl(text,q){ // 검색어와 맞는 부분을 강조. 공백 무시 비교라서 원문 글자 위치로 다시 찾는다
  const src=String(text||''); if(!q) return esc(src);
  const lower=src.toLowerCase(); const idx=[]; let pos=0; // 공백 뺀 인덱스 → 원문 인덱스
  for(let i=0;i<lower.length;i++) if(!/\s/.test(lower[i])) idx.push(i);
  const flat=idx.map(i=>lower[i]).join(''); const at=flat.indexOf(q); if(at<0) return esc(src);
  const a=idx[at], b=idx[at+q.length-1]+1;
  return esc(src.slice(0,a))+'<mark>'+esc(src.slice(a,b))+'</mark>'+esc(src.slice(b));
}
function searchResults(q){
  const t=today();
  const evs=S.events.filter(e=>[e.title,e.place,e.memo].some(v=>norm(v).includes(q)));
  let occ=[];
  for(const ev of evs){ if(ev.repeat==='none') occ.push(...occursIn(ev,ev.start,ev.start)); else occ.push(...occursIn(ev,addDays(t,-366),addDays(t,366))) }
  occ.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.ev.time||'').localeCompare(b.ev.time||''));
  // 지난 것은 아래로 보내지 않고 날짜순 그대로 두되, 오늘 이후가 먼저 보이도록 두 묶음으로 나눈다
  const up=occ.filter(o=>o.end>=t), past=occ.filter(o=>o.end<t).reverse();
  const section=(title,list)=>list.length?`<div class="eyebrow page" style="margin-top:18px">${title}</div>`+groupBy(list,o=>o.start).map(([d,l])=>{ const hol=holidayOf(d); return `<section class="group" style="margin-top:10px"><div class="dayhead"><span class="d ${d===t?'today':''}">${esc(kdate(d,true))}</span>${hol?`<span class="h">${esc(hol)}</span>`:''}<span class="c">${esc(relDay(diff(t,d)))}</span></div><div class="list">${l.map(o=>eventRow(o,{q})).join('')}</div></section>` }).join(''):'';
  if(!occ.length) return `<div class="list" style="margin-top:16px"><div class="empty"><b>"${esc(Q.trim())}" 일정이 없어요</b>제목, 장소, 메모에서 찾아요. 띄어쓰기는 무시해요.</div></div>`;
  return `<div class="rescount"><b>${evs.length}</b>개 일정 · 반복 일정은 앞뒤 1년치만 보여요</div>${section('다가오는 일정',up)}${section('지난 일정',past)}`;
}
function listBody(){
  const q=norm(Q); if(q) return searchResults(q);
  const t=today(), mode=V.list||'upcoming';
  const chips=`<div class="chips">
    <button type="button" class="chip ${mode==='upcoming'?'on':''}" data-act="list-mode" data-mode="upcoming">다가오는 일정</button>
    <button type="button" class="chip ${mode==='past'?'on':''}" data-act="list-mode" data-mode="past">지난 일정</button>
  </div>`;
  let occ, groups;
  if(mode==='upcoming'){
    occ=occurrences(addDays(t,-60),addDays(t,366)).filter(o=>o.end>=t);
    groups=groupBy(occ,o=>o.start<t?t:o.start);
    if(!occ.length) return chips+`<div class="list" style="margin-top:16px"><div class="empty"><b>다가오는 일정이 없어요</b>오른쪽 아래 + 버튼으로 첫 일정을 넣어 보세요.</div></div>`;
  } else {
    occ=occurrences(addDays(t,-366),addDays(t,-1)).filter(o=>o.end<t).reverse();
    groups=groupBy(occ,o=>o.start);
    if(!occ.length) return chips+`<div class="list" style="margin-top:16px"><div class="empty"><b>지난 일정이 없어요</b>최근 1년 안에 끝난 일정이 여기 보여요.</div></div>`;
  }
  const html=groups.map(([d,list])=>{
    const hol=holidayOf(d); const n=diff(t,d);
    return `<section class="group"><div class="dayhead"><span class="d ${d===t?'today':''}">${esc(kdate(d,d.slice(0,4)!==t.slice(0,4)))}</span>${hol?`<span class="h">${esc(hol)}</span>`:''}<span class="c">${mode==='upcoming'?esc(relDay(n)):esc(relDay(n))}</span></div>
      <div class="list">${list.map(o=>eventRow(o)).join('')}</div></section>`;
  }).join('');
  const more=mode==='upcoming'?`<div class="empty small" style="padding-top:18px">앞으로 1년까지 보여요. 반복 일정은 날짜마다 따로 나와요.</div>`:'';
  return chips+html+more;
}
function listPage(){
  return `<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="q" placeholder="제목·장소·메모 검색" value="${esc(Q)}" autocomplete="off" enterkeyhint="search" aria-label="일정 검색"><button type="button" class="clr" id="qClr" aria-label="검색어 지우기"${Q?'':' hidden'}>${I.x}</button></div><div id="listBody">${listBody()}</div>`;
}
let qTimer=null;
document.addEventListener('input',e=>{ if(e.target.id!=='q') return; Q=e.target.value; clearTimeout(qTimer); qTimer=setTimeout(()=>{ const b=document.getElementById('listBody'), c=document.getElementById('qClr'); if(b) b.innerHTML=listBody(); if(c) c.hidden=!Q },120) });
document.addEventListener('click',e=>{ if(!e.target.closest('#qClr')) return; Q=''; const i=document.getElementById('q'), b=document.getElementById('listBody'); if(i){ i.value=''; i.focus() } if(b) b.innerHTML=listBody(); e.target.closest('#qClr').hidden=true });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='q') e.target.blur() });
function groupBy(arr,keyFn){ const m=new Map(); for(const o of arr){ const k=keyFn(o); (m.get(k)||m.set(k,[]).get(k)).push(o) } return [...m.entries()] }

/* ====================== 시트 ====================== */
function openSheet(title,body,{submitLabel='저장',onSubmit,extraFooter=''}={}){
  const root=document.getElementById('sheetRoot');
  root.innerHTML=`<div class="overlay" id="ov"><form class="sheet" id="sheetForm" novalidate>
    <div class="sheet-h"><h2>${esc(title)}</h2><button type="button" class="iconbtn" data-close aria-label="닫기">${I.x}</button></div>
    <div class="sheet-b">${body}</div>
    <div class="sheet-f">${extraFooter}<button type="submit" class="btn primary">${esc(submitLabel)}</button></div></form></div>`;
  const ov=root.querySelector('#ov'), form=root.querySelector('#sheetForm');
  ov.addEventListener('click',e=>{ if(e.target===ov) closeSheet() });
  form.querySelector('[data-close]').addEventListener('click',closeSheet);
  form.addEventListener('submit',e=>{ e.preventDefault(); onSubmit&&onSubmit(form) });
  document.body.style.overflow='hidden';
  return form;
}
function closeSheet(){ document.getElementById('sheetRoot').innerHTML=''; document.body.style.overflow='' }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet() });
function field(label,inner,hint){ return `<div class="field"><label class="k">${esc(label)}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>` }

function editSheet(ev,{isNew=false}={}){
  let allDay=!!ev.allDay;
  const colors=COLORS.map(([k,n])=>`<label class="cchip c-${k}"><input type="radio" name="color" value="${k}"${ev.color===k?' checked':''}><i></i>${n}</label>`).join('');

    <div class="field"><span class="k">시간</span><div class="seg" id="seg"><button type="button" class="${allDay?'on':''}" data-allday="1">하루 종일</button><button type="button" class="${allDay?'':'on'}" data-allday="0">시간 지정</button></div></div>
    <div class="two">
      ${field('날짜',`<input class="input" type="date" name="start" value="${ev.start}" required>`)}
      ${field('마지막 날',`<input class="input" type="date" name="end" value="${ev.end||''}" min="${ev.start}">`,'여러 날 일정이면 입력')}
    </div>
    <div class="two" id="timeRow"${allDay?' hidden':''}>
      ${field('시작 시간',`<input class="input" type="time" name="time" value="${ev.time||''}">`)}
      ${field('끝나는 시간',`<input class="input" type="time" name="endTime" value="${ev.endTime||''}">`,'비워도 돼요')}
    </div>
    ${field('반복',`<select class="input" name="repeat">${reps}</select>`,'생일·기념일은 매년, 월세·구독은 매월로 넣으면 해마다 자동으로 나와요')}

    ${field('메모',`<textarea class="input" name="memo" rows="2" maxlength="500" placeholder="챙길 것, 링크, 연락처 등">${esc(ev.memo)}</textarea>`)}
    ${!isNew&&ev.repeat!=='none'?`<div class="infobox plain">반복 일정이에요. 고치거나 지우면 모든 반복 날짜에 함께 적용돼요.</div>`:''}`;
  const form=openSheet(isNew?'일정 추가':'일정 수정',body,{
    submitLabel:'저장',
    extraFooter:isNew?'':`<button type="button" class="btn danger" id="delBtn">삭제</button>`,
    onSubmit:f=>{
      const title=f.title.value.trim(); if(!title) return toast('제목을 입력해 주세요');
      const start=f.start.value; if(!isDate(start)) return toast('날짜를 입력해 주세요');
      let end=f.end.value||null; if(end&&!isDate(end)) return toast('마지막 날 형식이 맞지 않아요');
      if(end&&end<start) return toast('마지막 날이 시작 날보다 빨라요');
      if(end===start) end=null;
      if(end&&diff(start,end)>365) return toast('1년을 넘는 일정은 넣을 수 없어요');
      const time=allDay?'':f.time.value, endTime=allDay?'':f.endTime.value;
      if(!allDay&&!isTime(time)) return toast('시작 시간을 넣거나 "하루 종일"을 선택해 주세요');
      if(endTime&&!end&&endTime<time) return toast('끝나는 시간이 시작 시간보다 빨라요');
      const color=(f.querySelector('input[name=color]:checked')||{}).value||'green';
      const data={id:ev.id,title,start,end,allDay,time,endTime,color,place:f.place.value.trim(),memo:f.memo.value.trim(),repeat:f.repeat.value,sample:false};
      if(isNew) S.events.push(data); else { const i=S.events.findIndex(x=>x.id===ev.id); if(i>=0) S.events[i]=data; else S.events.push(data) }
      save(); closeSheet(); V.month=start.slice(0,7); V.sel=start; saveView(); render(); toast(isNew?'일정을 추가했어요':'수정했어요');
    }
  });

  form.start.addEventListener('change',()=>{ form.end.min=form.start.value; if(form.end.value&&form.end.value<form.start.value) form.end.value='' });
  if(isNew) setTimeout(()=>{ try{form.title.focus()}catch(e){} },50);
  const del=form.querySelector('#delBtn');
  if(del) del.addEventListener('click',()=>{ if(!del.dataset.armed){del.dataset.armed='1';del.textContent='정말 삭제';setTimeout(()=>{if(del.isConnected){delete del.dataset.armed;del.textContent='삭제'}},3000);return} S.events=S.events.filter(q=>q.id!==ev.id); save(); closeSheet(); render(); toast('삭제했어요') });
}

/* 연/월 선택 */
function monthPicker(){
  let [py]=V.month.split('-').map(Number);
  const cur=V.month, tm=today().slice(0,7);
  const body=`<div class="yrow"><button type="button" class="iconbtn" data-y="-1" aria-label="이전 해">${I.prev}</button><span class="yl" id="yl"></span><button type="button" class="iconbtn" data-y="1" aria-label="다음 해">${I.next}</button></div><div class="mgrid" id="mg"></div><div class="hint" style="margin-top:10px;font-size:12px;color:var(--muted)">점이 있는 달에 일정이 있어요.</div>`;
  const form=openSheet('이동할 달 선택',body,{submitLabel:'이번 달로',onSubmit:()=>{ V.month=tm; V.sel=today(); saveView(); closeSheet(); render() }});
  const draw=()=>{
    const has=new Set(); for(const o of occurrences(`${py}-01-01`,`${py}-12-31`)) for(let d=o.start<`${py}-01-01`?`${py}-01-01`:o.start;d<=o.end&&d.startsWith(String(py));d=addDays(d,1)) has.add(d.slice(0,7));
    form.querySelector('#yl').textContent=py+'년';
    form.querySelector('#mg').innerHTML=Array.from({length:12},(_,i)=>{ const k=`${py}-${pad(i+1)}`; return `<button type="button" data-m="${k}" class="${k===cur?'on':''} ${k===tm?'cur':''} ${has.has(k)?'has':''}">${i+1}월</button>` }).join('');
  };
  form.querySelectorAll('[data-y]').forEach(b=>b.addEventListener('click',()=>{ py+=Number(b.dataset.y); draw() }));
  form.querySelector('#mg').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; V.month=b.dataset.m; V.sel=V.month===tm?today():V.month+'-01'; saveView(); closeSheet(); render() });
  draw();
}

  form.querySelector('#copyBtn').addEventListener('click',async()=>{ const box=form.querySelector('#exportBox'); try{await navigator.clipboard.writeText(json);toast('복사했어요')}catch(e){box.select();try{document.execCommand('copy');toast('복사했어요')}catch(e2){toast('길게 눌러 직접 복사해 주세요')}} });
  form.querySelector('#dlBtn').addEventListener('click',()=>{ try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=fname;a.click();toast('저장을 시작했어요. 안 되면 파일로 공유나 복사를 써 주세요')}catch(e){toast('이 환경에선 파일 저장이 막혀 있어요. 파일로 공유나 복사를 써 주세요')} });
  form.querySelector('#shareBtn').addEventListener('click',async()=>{ try{ const file=new File([json],fname,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'일정 달력 백업'}); toast('공유 창을 열었어요') } else if(navigator.share){ await navigator.share({title:'일정 달력 백업',text:json}); toast('텍스트로 공유했어요') } else toast('이 브라우저는 공유를 지원하지 않아요. 복사나 파일 저장을 써 주세요') }catch(e){ if(e&&e.name!=='AbortError') toast('공유하지 못했어요. 복사나 파일 저장을 써 주세요') } });
  form.querySelector('#importFile').addEventListener('change',ev=>{ const f=ev.target.files&&ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ form.querySelector('#importBox').value=String(r.result||''); toast(`${f.name} 읽었어요. 합치기 또는 덮어쓰기를 눌러 주세요`) }; r.onerror=()=>toast('파일을 읽지 못했어요'); r.readAsText(f) });
  const parseIn=()=>{ try{ const d=JSON.parse(form.querySelector('#importBox').value); if(!d||!Array.isArray(d.events)) throw 0; return migrate(d) }catch(e){ toast('형식이 맞지 않아요. 백업한 내용 전체를 붙여넣어 주세요'); return null } };
  form.querySelector('#mergeBtn').addEventListener('click',()=>{ const d=parseIn(); if(!d) return; let n=0; for(const e of d.events){ if(S.events.some(x=>x.id===e.id)) continue; S.events.push(e); n++ } save(); closeSheet(); render(); toast(`${n}개 일정을 가져왔어요`) });
  const rb=form.querySelector('#replaceBtn'); rb.addEventListener('click',()=>{ if(!rb.dataset.armed){rb.dataset.armed='1';rb.textContent='정말 덮어쓰기';return} const d=parseIn(); if(!d) return; d.settings=Object.assign({},S.settings,d.settings||{}); S=d; save(); closeSheet(); render(); toast('덮어썼어요') });
}

/* ====================== 토스트 ====================== */
let toastTimer=null;
function toast(msg){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{r.innerHTML=''},2400) }

/* ====================== 액션 ====================== */
function shiftMonth(n){ const [y,m]=V.month.split('-').map(Number); const d=new Date(y,m-1+n,1); V.month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; V.sel=V.month===today().slice(0,7)?today():V.month+'-01'; saveView(); render() }
const ACTIONS={
  'tab':d=>{ if(d.tab!=='list') Q=''; V.tab=d.tab; saveView(); render(); window.scrollTo(0,0) },
  'list-mode':d=>{ V.list=d.mode; saveView(); render() },
  'pick-month':()=>monthPicker(),
  'backup':()=>backupSheet(),
  'settings':()=>settingsSheet(),
  'month-prev':()=>shiftMonth(-1),
  'month-next':()=>shiftMonth(1),
  'month-today':()=>{ V.month=today().slice(0,7); V.sel=today(); saveView(); render() },
  'day':d=>{ if(V.sel===d.date){ editSheet(newEvent(d.date),{isNew:true}); return } V.sel=d.date; if(d.date.slice(0,7)!==V.month){ V.month=d.date.slice(0,7) } saveView(); render() },
  'edit':d=>{ const ev=S.events.find(q=>q.id===d.id); if(ev) editSheet(ev) },
  'add':d=>editSheet(newEvent(d.date||(V.tab==='cal'?V.sel:today())),{isNew:true}),
  'clear-sample':()=>{ S.events=S.events.filter(e=>!e.sample); save(); render(); toast('예시 일정을 지웠어요') },
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const fn=ACTIONS[b.dataset.act]; if(fn) fn(b.dataset) });

/* 날짜가 바뀌면(자정 지나거나 다시 열 때) 다시 그리기 */
let lastDay=today();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&today()!==lastDay){ lastDay=today(); render() } });

/* ====================== 시작 ====================== */
S=load(); if(!S){ S=seed(); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
V=loadView();
render();
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(e){} }
</script>
